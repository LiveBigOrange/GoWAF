admin:
    addr: 127.0.0.1:9090
    allowed_cidrs: []
    admin_log: ./admin.log
    username: admin
    passwordhash: $2a$10$RfCQNqMF3iwQhK9YmaD5befGDQh0fZtQ3vfrqCC.p3/zQVZncRzzC
database:
    config_path: ./config.db
    metrics_path: ./metrics.db
    logs_path: ./logs.db
geoip:
    db_path: ./GeoLite2-City.mmdb
default_proxy:
    listen_addr: :80
    protocol: http
    enabled: true
trustedproxies: []
log:
    file: ./waf.log
    level: info
    rotation:
        maxsize: 100
        maxbackups: 10
        maxage: 7
        compress: true
    format:
        time_format: 2006-01-02T15:04:05.000Z07:00
        fields:
            host: true
            query: true
            referer: true
            content_type: true
            body_size: true
            latency_us: false
auth:
    username: admin
    password: ""
tls:
    cert_dir: ./certs
    acme_email: ""
    domains: []
intel:
    enabled: false
    server_url: http://127.0.0.1:8443
    license_key: community_b905
    instance_id: ""
    tls:
        ca_cert_path: ""
        insecure_skip_verify: true
    connect_timeout_secs: 10
    request_timeout_secs: 30
    sync:
        enabled: false
        interval_secs: 3600
        data_types:
            - ip_blacklist
            - threat_signatures
            - ua_rules
            - path_rules
            - bot_ips
            - geoip
        full_sync_on_desync: false
    upload:
        enabled: false
        batch_size: 50
        interval_secs: 300
        data_types:
            - intercept_events
            - false_positives
        audit_mode: false
        auto_approve_patterns: []
        max_body_length: 4096
        exclusions:
            enabled: false
            paths: []
            ips: []
            hosts: []
    rule:
        priority: local_first
        intel_rule_prefix: intel-
        override_enabled: false
    sensitive_filter:
        enabled: false
        action: mask
        custom_patterns: []
    offline:
        allow_offline: false
        cache_retention_days: 7
        max_cache_age_hours: 24
    alerts:
        on_connection_lost: false
        on_sync_failure: false
        on_license_expiring: false
        on_upload_failure: false
        on_emergency_rule: false
        failure_threshold: 3
