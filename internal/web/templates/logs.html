{{define "logs"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问日志 - GoWAF</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }
        .filter-bar select:focus, .filter-bar input:focus {
            outline: none;
            border-color: #409eff;
        }
        .log-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .log-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 500;
            color: #2c3e50;
            font-size: 13px;
            border-bottom: 1px solid #e8e9ed;
        }
        .log-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .log-table tr:hover {
            background: #f8f9fa;
        }
        .log-table tr:last-child td {
            border-bottom: none;
        }
        .method-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        .method-badge.GET { background: #e3f2fd; color: #1976d2; }
        .method-badge.POST { background: #e8f5e9; color: #388e3c; }
        .method-badge.PUT { background: #fff3e0; color: #f57c00; }
        .method-badge.DELETE { background: #ffebee; color: #d32f2f; }
        .method-badge.PATCH { background: #f3e5f5; color: #7b1fa2; }
        .method-badge.HEAD, .method-badge.OPTIONS { background: #f5f5f5; color: #666; }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
        }
        .status-badge.success { background: #d4edda; color: #155724; }
        .status-badge.redirect { background: #cce5ff; color: #004085; }
        .status-badge.client-error { background: #fff3e0; color: #f57c00; }
        .status-badge.server-error { background: #f8d7da; color: #721c24; }

        /* 动作徽章样式 */
        .action-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
        }
        .action-badge.pass { background: #d4edda; color: #155724; }
        .action-badge.block { background: #f8d7da; color: #721c24; }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
            font-size: 14px;
        }
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 120px;
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            text-align: center;
        }
        .stat-card .label {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
        }

        /* 详情行样式 */
        .detail-row {
            display: none;
            background: #f8f9fa;
        }
        .detail-row.show {
            display: table-row;
        }
        .detail-content {
            padding: 15px;
            border-left: 3px solid #409eff;
        }
        .detail-item {
            display: flex;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .detail-item:last-child { margin-bottom: 0; }
        .detail-label {
            font-weight: 500;
            color: #596275;
            min-width: 100px;
        }
        .detail-value {
            color: #2c3e50;
            word-break: break-all;
        }
        .detail-value code {
            background: #e8e9ed;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }

        /* 查看详情按钮 */
        .view-btn {
            color: #409eff;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 4px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 13px;
        }
        .view-btn:hover {
            background-color: #409eff;
            color: white;
        }
    </style>
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <h2 style="margin-bottom: 20px; font-size: 20px; color: #2c3e50;">📋 访问日志</h2>
        
        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="label">总请求数</div>
                <div class="value" id="totalCount">-</div>
            </div>
            <div class="stat-card">
                <div class="label">成功请求</div>
                <div class="value" id="successCount" style="color: #28a745;">-</div>
            </div>
            <div class="stat-card">
                <div class="label">客户端错误</div>
                <div class="value" id="clientErrorCount" style="color: #ffc107;">-</div>
            </div>
            <div class="stat-card">
                <div class="label">服务器错误</div>
                <div class="value" id="serverErrorCount" style="color: #dc3545;">-</div>
            </div>
        </div>
        
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <select id="loadLimit" onchange="loadLogs()">
                <option value="500">加载 500 条</option>
                <option value="1000" selected>加载 1000 条</option>
                <option value="2000">加载 2000 条</option>
                <option value="5000">加载 5000 条</option>
            </select>
            <select id="filterMethod" onchange="applyFilters()">
                <option value="">所有方法</option>
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
                <option value="PATCH">PATCH</option>
            </select>
            <select id="filterAction" onchange="applyFilters()">
                <option value="">所有动作</option>
                <option value="pass">放行</option>
                <option value="block">拦截</option>
            </select>
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">所有状态</option>
                <option value="2xx">2xx 成功</option>
                <option value="3xx">3xx 重定向</option>
                <option value="4xx">4xx 客户端错误</option>
                <option value="5xx">5xx 服务器错误</option>
            </select>
            <input type="text" id="filterIP" placeholder="筛选IP地址" oninput="applyFilters()" style="width: 150px; max-width: 100%;">
            <input type="text" id="filterPath" placeholder="筛选路径" oninput="applyFilters()" style="width: 200px; max-width: 100%;">
            <button class="btn btn-primary" onclick="loadLogs()" style="padding: 8px 16px; background: #409eff; color: white; border: none; border-radius: 4px; cursor: pointer;">刷新</button>
            <button class="btn" onclick="exportLogs()" style="padding: 8px 16px; background: #67c23a; color: white; border: none; border-radius: 4px; cursor: pointer;">导出</button>
        </div>
        
        <!-- 日志表格 -->
        <table class="log-table">
            <thead>
                <tr>
                    <th style="width: 150px;">时间</th>
                    <th style="width: 120px;">客户端IP</th>
                    <th style="width: 80px;">地理位置</th>
                    <th style="width: 70px;">方法</th>
                    <th>路径</th>
                    <th style="width: 70px;">动作</th>
                    <th style="width: 70px;">状态码</th>
                    <th style="width: 80px;">耗时</th>
                    <th style="width: 100px;">后端</th>
                    <th style="width: 100px;">操作</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <tr><td colspan="10" class="empty-message">加载中...</td></tr>
            </tbody>
        </table>
        
        <!-- 分页 -->
        <div class="pagination" id="pagination" style="display:none;">
            <div class="pagination-info">
                <span id="pageInfo">第1 页 / 第1 页</span>
                <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                    <option value="20">20 条</option>
                    <option value="50" selected>50 条</option>
                    <option value="100">100 条</option>
                    <option value="200">200 条</option>
                </select>
            </div>
            <div class="pagination-btns">
                <button class="pagination-btn" id="prevBtn" onclick="prevPage()">上一页</button>
                <button class="pagination-btn" id="nextBtn" onclick="nextPage()">下一页</button>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            var allLogs = [];
            var filteredLogs = [];
            var currentPage = 1;
            var pageSize = 50;
            
            function escapeHtml(text) {
                if (text == null) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 时间格式化函数 - 将RFC3339格式转换为友好的显示格式
            function formatTime(timeStr) {
                if (!timeStr) return '-';
                try {
                    var date = new Date(timeStr);
                    if (isNaN(date.getTime())) return timeStr;

                    // 格式化为: YYYY-MM-DD HH:mm:ss
                    var year = date.getFullYear();
                    var month = String(date.getMonth() + 1).padStart(2, '0');
                    var day = String(date.getDate()).padStart(2, '0');
                    var hours = String(date.getHours()).padStart(2, '0');
                    var minutes = String(date.getMinutes()).padStart(2, '0');
                    var seconds = String(date.getSeconds()).padStart(2, '0');

                    return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
                } catch (e) {
                    return timeStr;
                }
            }

            // 字节大小格式化函数 - 转换为友好的显示格式
            function formatBytes(bytes) {
                if (!bytes || bytes === 0) return '0 B';
                var k = 1024;
                var sizes = ['B', 'KB', 'MB', 'GB'];
                var i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            window.loadLogs = function() {
                var limit = document.getElementById('loadLimit').value;
                fetch('/api/logs/list?limit=' + limit)
                    .then(r => r.json())
                    .then(data => {
                        allLogs = data.logs || [];
                        applyFilters();
                        updateStats();
                    })
                    .catch(err => {
                        console.error('加载日志失败:', err);
                        document.getElementById('logBody').innerHTML = '<tr><td colspan="10" class="empty-message">加载失败</td></tr>';
                    });
            }
            
            window.applyFilters = function() {
                var methodFilter = document.getElementById('filterMethod').value;
                var actionFilter = document.getElementById('filterAction').value;
                var statusFilter = document.getElementById('filterStatus').value;
                var ipFilter = document.getElementById('filterIP').value.toLowerCase().trim();
                var pathFilter = document.getElementById('filterPath').value.toLowerCase().trim();

                filteredLogs = allLogs.filter(function(log) {
                    if (methodFilter && log.method !== methodFilter) return false;

                    if (actionFilter && log.action !== actionFilter) return false;

                    if (statusFilter) {
                        var status = log.status;
                        if (statusFilter === '2xx' && (status < 200 || status >= 300)) return false;
                        if (statusFilter === '3xx' && (status < 300 || status >= 400)) return false;
                        if (statusFilter === '4xx' && (status < 400 || status >= 500)) return false;
                        if (statusFilter === '5xx' && status < 500) return false;
                    }

                    if (ipFilter && log.client_ip && log.client_ip.toLowerCase().indexOf(ipFilter) === -1) return false;
                    if (pathFilter && log.path && log.path.toLowerCase().indexOf(pathFilter) === -1) return false;

                    return true;
                });

                currentPage = 1;
                renderLogs();
            }
            
            function updateStats() {
                document.getElementById('totalCount').textContent = allLogs.length;
                
                var success = allLogs.filter(function(l) { return l.status >= 200 && l.status < 400; }).length;
                var clientError = allLogs.filter(function(l) { return l.status >= 400 && l.status < 500; }).length;
                var serverError = allLogs.filter(function(l) { return l.status >= 500; }).length;
                
                document.getElementById('successCount').textContent = success;
                document.getElementById('clientErrorCount').textContent = clientError;
                document.getElementById('serverErrorCount').textContent = serverError;
            }
            
            function renderLogs() {
                var tbody = document.getElementById('logBody');
                var pagination = document.getElementById('pagination');

                if (!filteredLogs || filteredLogs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="empty-message">暂无日志记录</td></tr>';
                    pagination.style.display = 'none';
                    return;
                }

                var totalPages = Math.ceil(filteredLogs.length / pageSize);
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                var start = (currentPage - 1) * pageSize;
                var end = Math.min(start + pageSize, filteredLogs.length);
                var pageData = filteredLogs.slice(start, end);

                tbody.innerHTML = '';
                pageData.forEach(function(log, index) {
                    var tr = document.createElement('tr');

                    var statusClass = 'success';
                    if (log.status >= 300 && log.status < 400) statusClass = 'redirect';
                    else if (log.status >= 400 && log.status < 500) statusClass = 'client-error';
                    else if (log.status >= 500) statusClass = 'server-error';

                    var methodClass = log.method || 'GET';

                    // 地理位置显示
                    var geoDisplay = '-';
                    if (log.geo_country) {
                        geoDisplay = (log.geo_flag || '') + ' ' + log.geo_country;
                    }

                    // 动作显示
                    var actionClass = log.action || 'pass';
                    var actionText = actionClass === 'block' ? '拦截' : '放行';

                    tr.innerHTML =
                        '<td style="color:#7f8c8d;">' + formatTime(log.timestamp) + '</td>' +
                        '<td style="color:#e74c3c;font-weight:500;">' + escapeHtml(log.client_ip) + '</td>' +
                        '<td style="color:#7f8c8d;font-size:12px;">' + escapeHtml(geoDisplay) + '</td>' +
                        '<td><span class="method-badge ' + methodClass + '">' + escapeHtml(log.method) + '</span></td>' +
                        '<td style="color:#2c3e50;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escapeHtml(log.path) + '">' + escapeHtml(log.path) + '</td>' +
                        '<td><span class="action-badge ' + actionClass + '">' + actionText + '</span></td>' +
                        '<td><span class="status-badge ' + statusClass + '">' + log.status + '</span></td>' +
                        '<td style="color:#95a5a6;">' + (log.latency_ms || 0) + 'ms</td>' +
                        '<td style="color:#7f8c8d;">' + escapeHtml(log.upstream_addr || '-') + '</td>' +
                        '<td><button class="view-btn" onclick="toggleDetail(' + index + ', event)">查看详情</button></td>';

                    tbody.appendChild(tr);

                    // 添加详情行
                    var detailTr = document.createElement('tr');
                    detailTr.className = 'detail-row';
                    detailTr.id = 'detail-' + index;

                    var detailHtml = '<td colspan="10"><div class="detail-content">';
                    detailHtml += '<div class="detail-item"><span class="detail-label">请求ID：</span><span class="detail-value"><code>' + escapeHtml(log.request_id || '-') + '</code></span></div>';
                    detailHtml += '<div class="detail-item"><span class="detail-label">时间戳：</span><span class="detail-value">' + formatTime(log.timestamp) + '</span></div>';
                    detailHtml += '<div class="detail-item"><span class="detail-label">客户端IP：</span><span class="detail-value"><code>' + escapeHtml(log.client_ip || '-') + '</code></span></div>';
                    if (log.geo_country) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">地理位置：</span><span class="detail-value">' + escapeHtml(log.geo_flag || '') + ' ' + escapeHtml(log.geo_country) + '</span></div>';
                    }
                    detailHtml += '<div class="detail-item"><span class="detail-label">请求Host：</span><span class="detail-value"><code>' + escapeHtml(log.host || '-') + '</code></span></div>';
                    detailHtml += '<div class="detail-item"><span class="detail-label">请求方法：</span><span class="detail-value"><code>' + escapeHtml(log.method || '-') + '</code></span></div>';
                    detailHtml += '<div class="detail-item"><span class="detail-label">请求路径：</span><span class="detail-value"><code>' + escapeHtml(log.path || '-') + '</code></span></div>';
                    if (log.query) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">查询参数：</span><span class="detail-value"><code>' + escapeHtml(log.query) + '</code></span></div>';
                    }
                    if (log.protocol) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">HTTP协议：</span><span class="detail-value"><code>' + escapeHtml(log.protocol) + '</code></span></div>';
                    }
                    if (log.scheme) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">请求协议：</span><span class="detail-value"><code>' + escapeHtml(log.scheme) + '</code></span></div>';
                    }
                    if (log.user_agent) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">User-Agent：</span><span class="detail-value">' + escapeHtml(log.user_agent) + '</span></div>';
                    }
                    if (log.referer) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">Referer：</span><span class="detail-value">' + escapeHtml(log.referer) + '</span></div>';
                    }
                    if (log.content_type) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">Content-Type：</span><span class="detail-value"><code>' + escapeHtml(log.content_type) + '</code></span></div>';
                    }
                    detailHtml += '<div class="detail-item"><span class="detail-label">处理动作：</span><span class="detail-value"><span class="action-badge ' + actionClass + '">' + actionText + '</span></span></div>';
                    detailHtml += '<div class="detail-item"><span class="detail-label">状态码：</span><span class="detail-value"><span class="status-badge ' + statusClass + '">' + log.status + '</span></span></div>';
                    if (log.rule_id) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">规则ID：</span><span class="detail-value"><code>' + escapeHtml(log.rule_id) + '</code></span></div>';
                    }
                    detailHtml += '<div class="detail-item"><span class="detail-label">响应延迟：</span><span class="detail-value">' + (log.latency_ms ? log.latency_ms.toFixed(2) + ' ms' : '-') + '</span></div>';
                    if (log.upstream_latency_ms) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">后端延迟：</span><span class="detail-value">' + log.upstream_latency_ms.toFixed(2) + ' ms</span></div>';
                    }
                    if (log.latency_us) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">精确延迟：</span><span class="detail-value">' + log.latency_us + ' μs</span></div>';
                    }
                    if (log.request_size) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">请求大小：</span><span class="detail-value">' + formatBytes(log.request_size) + '</span></div>';
                    }
                    if (log.body_size) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">响应大小：</span><span class="detail-value">' + formatBytes(log.body_size) + '</span></div>';
                    }
                    detailHtml += '<div class="detail-item"><span class="detail-label">后端地址：</span><span class="detail-value"><code>' + escapeHtml(log.upstream_addr || '-') + '</code></span></div>';
                    if (log.error_message) {
                        detailHtml += '<div class="detail-item"><span class="detail-label">错误信息：</span><span class="detail-value" style="color:#e74c3c;">' + escapeHtml(log.error_message) + '</span></div>';
                    }
                    detailHtml += '</div></td>';

                    detailTr.innerHTML = detailHtml;
                    tbody.appendChild(detailTr);
                });

                document.getElementById('pageInfo').textContent = '第' + currentPage + ' 页 / 第' + totalPages + ' 页（共' + filteredLogs.length + ' 条）';
                document.getElementById('prevBtn').disabled = currentPage <= 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;
                pagination.style.display = 'flex';
            }
            
            window.prevPage = function() {
                if (currentPage > 1) {
                    currentPage--;
                    renderLogs();
                }
            };
            
            window.nextPage = function() {
                var totalPages = Math.ceil(filteredLogs.length / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderLogs();
                }
            };
            
            window.changePageSize = function() {
                pageSize = parseInt(document.getElementById('pageSize').value);
                currentPage = 1;
                renderLogs();
            };
            
            window.exportLogs = function() {
                var dataStr = JSON.stringify(filteredLogs, null, 2);
                var blob = new Blob([dataStr], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                var d = new Date(); a.download = 'access_logs_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            // 切换详情显示
            window.toggleDetail = function(index, e) {
                var detailRow = document.getElementById('detail-' + index);
                var btn = e.target;
                if (detailRow.classList.contains('show')) {
                    detailRow.classList.remove('show');
                    btn.textContent = '查看详情';
                } else {
                    detailRow.classList.add('show');
                    btn.textContent = '收起详情';
                }
            };

            // 初始加载
            loadLogs();
            
            // 每30秒自动刷新
            setInterval(loadLogs, 30000);
        })();
    </script>
</body>
</html>
{{end}}
