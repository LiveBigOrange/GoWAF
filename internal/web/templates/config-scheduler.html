<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GoWAF 定时任务配置页面 · 管理定时任务参数">
    <title>定时任务配置 · GoWAF</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <style>
        /* ===== 主容器布局 ===== */
        .main-content {
            flex: 1;
            padding: 24px 40px;
            overflow-y: auto;
            overflow-x: hidden;
            height: 100vh;
            box-sizing: border-box;
            min-width: 0;
        }
        
        @media (max-width: 1200px) {
            .main-content {
                padding: 24px 20px;
            }
        }
        
        /* ===== 布局与卡片 ===== */
        .config-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .config-section h2 {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #409eff;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-section h2 .icon {
            font-size: 20px;
        }

        /* ===== 输入网格 ===== */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 16px;
        }
        
        /* 大屏幕优化 - 3列 */
        @media (min-width: 1200px) {
            .config-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        /* 超大屏幕 - 4列 */
        @media (min-width: 1600px) {
            .config-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        /* 超超大屏幕 - 5列 */
        @media (min-width: 2000px) {
            .config-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .config-item {
            display: flex;
            flex-direction: column;
        }

        .config-item label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .config-item label small {
            color: #999;
            font-weight: normal;
            font-size: 12px;
        }

        .config-item input,
        .config-item select {
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
            width: 100%;
            box-sizing: border-box;
        }

        .config-item input:focus,
        .config-item select:focus {
            outline: none;
            border-color: #409eff;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.15);
        }

        .config-item input[type="number"] {
            width: 100%;
            -moz-appearance: textfield;
        }
        .config-item input[type="number"]::-webkit-inner-spin-button,
        .config-item input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }

        /* ===== 辅助文字 ===== */
        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .help-text::before {
            content: "💡";
            font-size: 11px;
            flex-shrink: 0;
        }

        /* ===== 按钮区域 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            bottom: 0;
            z-index: 10;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #409eff;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #555;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #fff;
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        .btn-danger:hover {
            background: #dc3545;
            color: white;
        }

        /* ===== 提示消息 ===== */
        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: flex;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: flex;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            display: flex;
        }

        /* ===== 修改高亮 ===== */
        .config-changed {
            border-color: #409eff !important;
            background: #f0f4ff !important;
        }

        .change-indicator {
            display: none;
            color: #409eff;
            font-size: 12px;
            margin-left: 8px;
        }

        .change-indicator.show {
            display: inline;
        }
    </style>
</head>
<body>
    {{template "sidebar" .}}

    <main class="main-content">
        <div id="alert" class="alert" role="alert" aria-live="polite"></div>

        <!-- 定时任务配置 -->
        <section class="config-section" aria-labelledby="scheduler-heading">
            <h2 id="scheduler-heading"><span aria-hidden="true">⏰</span> 定时任务配置</h2>
            <div class="config-grid">
                <div class="config-item">
                    <label for="health_check">健康检查间隔 <small>(秒)</small></label>
                    <input type="number" id="health_check" min="1" max="300" autocomplete="off">
                    <div class="help-text">后端健康检查频率</div>
                </div>
                <div class="config-item">
                    <label for="log_flush">日志刷新间隔 <small>(秒)</small></label>
                    <input type="number" id="log_flush" min="1" max="60" autocomplete="off">
                    <div class="help-text">日志写入磁盘频率</div>
                </div>
                <div class="config-item">
                    <label for="log_cleanup">日志清理检查 <small>(小时)</small></label>
                    <input type="number" id="log_cleanup" min="1" max="168" autocomplete="off">
                    <div class="help-text">定期清理旧日志</div>
                </div>
                <div class="config-item">
                    <label for="metrics_cleanup">指标清理间隔 <small>(小时)</small></label>
                    <input type="number" id="metrics_cleanup" min="1" max="72" autocomplete="off">
                    <div class="help-text">监控数据清理频率</div>
                </div>
                <div class="config-item">
                    <label for="rule_reload">规则重载间隔 <small>(秒)</small></label>
                    <input type="number" id="rule_reload" min="1" max="300" autocomplete="off">
                    <div class="help-text">规则自动重载频率</div>
                </div>
            </div>
        </section>

        <div class="btn-group">
            <button type="button" class="btn btn-danger" onclick="resetConfig()">
                <span aria-hidden="true">🔄</span> 恢复默认
            </button>
            <button type="button" class="btn btn-secondary" onclick="location.reload()">
                <span aria-hidden="true">↻</span> 刷新页面
            </button>
            <button type="button" class="btn btn-primary" id="saveBtn" onclick="saveConfig()">
                <span aria-hidden="true">💾</span> 保存配置
            </button>
        </div>
    </main>

    <script>
        let originalConfig = {};
        let hasChanges = false;

        function safeInt(val, def) { var n = parseInt(val, 10); return isNaN(n) ? def : n; }

        function loadConfig() {
            fetch('/api/config/scheduler')
                .then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                })
                .then(data => {
                    if (data.error) {
                        showAlert('error', '❌ ' + data.error);
                        return;
                    }

                    originalConfig = JSON.parse(JSON.stringify(data));

                    document.getElementById('health_check').value     = data.health_check || 5;
                    document.getElementById('log_flush').value        = data.log_flush || 2;
                    document.getElementById('log_cleanup').value      = data.log_cleanup || 24;
                    document.getElementById('metrics_cleanup').value  = data.metrics_cleanup || 1;
                    document.getElementById('rule_reload').value      = data.rule_reload || 5;
                })
                .catch(err => {
                    showAlert('error', '❌ 加载配置失败: ' + err.message);
                });
        }

        function saveConfig() {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<span aria-hidden="true">⏳</span> 保存中...';

            const config = {
                health_check: safeInt(document.getElementById('health_check').value, 5),
                log_flush: safeInt(document.getElementById('log_flush').value, 2),
                log_cleanup: safeInt(document.getElementById('log_cleanup').value, 24),
                metrics_cleanup: safeInt(document.getElementById('metrics_cleanup').value, 1),
                rule_reload: safeInt(document.getElementById('rule_reload').value, 5)
            };

            fetch('/api/config/scheduler', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(config)
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                if (data.error) {
                    showAlert('error', '❌ ' + data.error);
                } else {
                    showAlert('success', '✅ 定时任务配置保存成功！指标清理间隔已生效，其他定时任务配置需重启服务生效。');
                    hasChanges = false;
                    originalConfig = JSON.parse(JSON.stringify(config));
                    // 移除所有修改高亮
                    document.querySelectorAll('.config-changed').forEach(el => el.classList.remove('config-changed'));
                }
            })
            .catch(err => {
                showAlert('error', '❌ 保存配置失败: ' + err.message);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<span aria-hidden="true">💾</span> 保存配置';
            });
        }

        function resetConfig() {
            if (!confirm('⚠️ 确定要恢复默认定时任务配置吗？这将覆盖当前所有定时任务配置。')) return;

            fetch('/api/config/scheduler/reset', {
                method: 'POST'
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                if (data.error) {
                    showAlert('error', '❌ ' + data.error);
                } else {
                    showAlert('success', '✅ 已恢复默认定时任务配置');
                    setTimeout(loadConfig, 500);
                }
            })
            .catch(err => {
                showAlert('error', '❌ 恢复默认配置失败: ' + err.message);
            });
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'flex';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadConfig();

            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('change', function() {
                    hasChanges = true;
                    this.classList.add('config-changed');
                });
            });
        });

        window.addEventListener('beforeunload', function(e) {
            if (hasChanges) {
                e.preventDefault();
                e.returnValue = '您有未保存的配置更改，确定要离开吗？';
            }
        });
    </script>
</body>
</html>
