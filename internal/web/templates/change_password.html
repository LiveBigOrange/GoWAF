{{define "change_password"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · GoWAF</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <style>
        .main-content {
            flex: 1;
            padding: 24px 40px;
            overflow-y: auto;
            overflow-x: hidden;
            height: 100vh;
            box-sizing: border-box;
            min-width: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        @media (max-width: 1200px) {
            .main-content { padding: 24px 20px; }
        }

        .password-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .password-card {
                padding: 28px 20px;
                margin-top: 0;
                border-radius: 12px;
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #409eff, #667eea);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 22px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .card-header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #8e8ea0;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; display: flex; }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: flex; }

        .form-step {
            margin-bottom: 18px;
        }

        .step-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        .step-num {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .form-step.active .step-num {
            background: #409eff;
            color: #fff;
        }

        .form-step.done .step-num {
            background: #10b981;
            color: #fff;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 11px 42px 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #409eff;
            box-shadow: 0 0 0 3px rgba(64,158,255,0.1);
            background: #fff;
        }

        .input-wrapper input.valid {
            border-color: #10b981;
        }

        .input-wrapper input.invalid {
            border-color: #ef4444;
        }

        .toggle-visibility {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            color: #bbb;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .toggle-visibility:hover {
            color: #409eff;
        }

        .strength-meter {
            margin-top: 8px;
            display: none;
        }

        .strength-meter.visible {
            display: block;
        }

        .strength-track {
            height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0;
        }

        .strength-bar.weak { width: 33%; background: #ef4444; }
        .strength-bar.medium { width: 66%; background: #f59e0b; }
        .strength-bar.strong { width: 100%; background: #10b981; }

        .strength-label {
            font-size: 12px;
            font-weight: 500;
        }
        .strength-label.weak { color: #ef4444; }
        .strength-label.medium { color: #f59e0b; }
        .strength-label.strong { color: #10b981; }

        .requirements {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px 10px;
        }

        .req-item {
            font-size: 12px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .req-item.met { color: #10b981; }

        .req-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ddd;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .req-item.met .req-dot { background: #10b981; }

        .mismatch-hint {
            font-size: 12px;
            color: #ef4444;
            margin-top: 4px;
            display: none;
        }

        .mismatch-hint.visible { display: block; }

        .match-hint {
            font-size: 12px;
            color: #10b981;
            margin-top: 4px;
            display: none;
        }

        .match-hint.visible { display: block; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: linear-gradient(135deg, #409eff, #667eea);
            color: white;
            transition: all 0.2s;
            margin-top: 6px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(64,158,255,0.35);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-submit.ready {
            background: linear-gradient(135deg, #10b981, #059669);
        }
    </style>
</head>
<body>
    {{template "sidebar" .}}

    <main class="main-content">
        <div class="password-card">
            <div id="alert" class="alert" role="alert" aria-live="polite"></div>

            <div class="card-header">
                <div class="card-icon">&#128272;</div>
                <h2>修改管理员密码</h2>
                <p>修改后需重新登录</p>
            </div>

            <div class="form-step active" id="step1">
                <div class="step-label"><span class="step-num">1</span>原密码</div>
                <div class="input-wrapper">
                    <input type="password" id="oldPassword" autocomplete="current-password" placeholder="输入当前密码">
                    <button type="button" class="toggle-visibility" onclick="togglePwd('oldPassword', this)" aria-label="切换密码可见性">&#128065;</button>
                </div>
            </div>

            <div class="form-step" id="step2">
                <div class="step-label"><span class="step-num">2</span>新密码</div>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" autocomplete="new-password" placeholder="设置新密码">
                    <button type="button" class="toggle-visibility" onclick="togglePwd('newPassword', this)" aria-label="切换密码可见性">&#128065;</button>
                </div>
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-track"><div class="strength-bar" id="strengthBar"></div></div>
                    <div class="strength-label" id="strengthLabel"></div>
                </div>
                <div class="requirements">
                    <div class="req-item" id="req-length"><span class="req-dot"></span>至少8个字符</div>
                    <div class="req-item" id="req-upper"><span class="req-dot"></span>1个大写字母</div>
                    <div class="req-item" id="req-lower"><span class="req-dot"></span>1个小写字母</div>
                    <div class="req-item" id="req-number"><span class="req-dot"></span>1个数字</div>
                    <div class="req-item" id="req-special"><span class="req-dot"></span>1个特殊字符</div>
                </div>
            </div>

            <div class="form-step" id="step3">
                <div class="step-label"><span class="step-num">3</span>确认新密码</div>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="再次输入新密码">
                    <button type="button" class="toggle-visibility" onclick="togglePwd('confirmPassword', this)" aria-label="切换密码可见性">&#128065;</button>
                </div>
                <div class="mismatch-hint" id="mismatchHint">两次输入的密码不一致</div>
                <div class="match-hint" id="matchHint">密码一致</div>
            </div>

            <button type="button" class="btn-submit" id="saveBtn" onclick="submitPassword()">确认修改</button>
        </div>
    </main>

    <script>
        function togglePwd(id, btn) {
            var input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '\u{1F512}';
            } else {
                input.type = 'password';
                btn.textContent = '\u{1F441}';
            }
        }

        function checkStrength(pwd) {
            var checks = {
                length: pwd.length >= 8,
                upper: /[A-Z]/.test(pwd),
                lower: /[a-z]/.test(pwd),
                number: /[0-9]/.test(pwd),
                special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pwd)
            };

            for (var key in checks) {
                var el = document.getElementById('req-' + key);
                if (el) el.classList.toggle('met', checks[key]);
            }

            var met = 0;
            for (var k in checks) if (checks[k]) met++;

            var meter = document.getElementById('strengthMeter');
            var bar = document.getElementById('strengthBar');
            var label = document.getElementById('strengthLabel');

            if (pwd.length > 0) {
                meter.classList.add('visible');
                bar.className = 'strength-bar ' + (met >= 5 ? 'strong' : met >= 3 ? 'medium' : 'weak');
                label.className = 'strength-label ' + (met >= 5 ? 'strong' : met >= 3 ? 'medium' : 'weak');
                label.textContent = met >= 5 ? '强' : met >= 3 ? '中等' : '弱';
            } else {
                meter.classList.remove('visible');
            }

            return checks;
        }

        function checkMatch() {
            var np = document.getElementById('newPassword').value;
            var cp = document.getElementById('confirmPassword').value;
            var hint = document.getElementById('mismatchHint');
            var matchHint = document.getElementById('matchHint');
            var confirmInput = document.getElementById('confirmPassword');
            hint.classList.toggle('visible', cp.length > 0 && np !== cp);
            matchHint.classList.toggle('visible', cp.length > 0 && np === cp);
            confirmInput.classList.toggle('valid', cp.length > 0 && np === cp);
            confirmInput.classList.toggle('invalid', cp.length > 0 && np !== cp);
        }

        function updateSteps() {
            var oldPwd = document.getElementById('oldPassword').value;
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;

            var s1 = document.getElementById('step1');
            var s2 = document.getElementById('step2');
            var s3 = document.getElementById('step3');
            var btn = document.getElementById('saveBtn');

            s1.classList.toggle('done', oldPwd.length > 0);
            s1.classList.toggle('active', oldPwd.length === 0);

            var checks = checkStrength(newPwd);
            var allMet = checks.length && checks.upper && checks.lower && checks.number && checks.special;
            s2.classList.toggle('done', allMet);
            s2.classList.toggle('active', oldPwd.length > 0 && !allMet);

            var matched = newPwd.length > 0 && confirmPwd.length > 0 && newPwd === confirmPwd;
            s3.classList.toggle('done', matched);
            s3.classList.toggle('active', allMet && !matched);

            btn.classList.toggle('ready', oldPwd.length > 0 && allMet && matched);
        }

        function submitPassword() {
            var oldPwd = document.getElementById('oldPassword').value;
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;

            if (!oldPwd) {
                showAlert('error', '请输入原密码');
                document.getElementById('oldPassword').focus();
                return;
            }

            if (!newPwd) {
                showAlert('error', '请输入新密码');
                document.getElementById('newPassword').focus();
                return;
            }

            if (!confirmPwd) {
                showAlert('error', '请确认新密码');
                document.getElementById('confirmPassword').focus();
                return;
            }

            if (newPwd !== confirmPwd) {
                showAlert('error', '两次输入的新密码不一致');
                document.getElementById('confirmPassword').focus();
                return;
            }

            var checks = checkStrength(newPwd);
            var unmet = [];
            if (!checks.length) unmet.push('至少8个字符');
            if (!checks.upper) unmet.push('1个大写字母');
            if (!checks.lower) unmet.push('1个小写字母');
            if (!checks.number) unmet.push('1个数字');
            if (!checks.special) unmet.push('1个特殊字符');
            if (unmet.length > 0) {
                showAlert('error', '密码不满足要求: ' + unmet.join('、'));
                document.getElementById('newPassword').focus();
                return;
            }

            var btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '修改中...';

            fetch('/api/admin/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
            })
            .then(function(r) {
                return r.json().then(function(data) {
                    if (!r.ok) {
                        throw new Error(data.error || 'HTTP ' + r.status);
                    }
                    return data;
                });
            })
            .then(function(data) {
                if (data.error) {
                    showAlert('error', data.error);
                    if (data.error.indexOf('原密码') >= 0) {
                        document.getElementById('oldPassword').focus();
                    }
                } else {
                    showAlert('success', data.message || '密码修改成功，即将跳转');
                    setTimeout(function() { window.location.href = '/logout'; }, 2000);
                }
            })
            .catch(function(err) {
                showAlert('error', '修改失败: ' + err.message);
            })
            .finally(function() {
                btn.disabled = false;
                btn.textContent = '确认修改';
            });
        }

        function showAlert(type, message) {
            var el = document.getElementById('alert');
            el.className = 'alert alert-' + type;
            el.textContent = (type === 'success' ? '\u2713 ' : '\u2717 ') + message;
            el.style.display = 'flex';
            if (type === 'error') {
                el.style.cursor = 'pointer';
                el.title = '\u70B9\u51FB\u5173\u95ED';
            } else {
                setTimeout(function() { el.style.display = 'none'; }, 3000);
            }
        }

        document.getElementById('alert').addEventListener('click', function() {
            this.style.display = 'none';
        });

        function getCSRFToken() {
            var c = document.cookie.split('; ').find(function(r) { return r.startsWith('csrf_token='); });
            return c ? c.split('=')[1] : '';
        }

        document.getElementById('oldPassword').addEventListener('input', updateSteps);

        document.getElementById('newPassword').addEventListener('input', function() {
            checkStrength(this.value);
            checkMatch();
            updateSteps();
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            checkMatch();
            updateSteps();
        });

        document.getElementById('oldPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('newPassword').focus();
        });

        document.getElementById('newPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('confirmPassword').focus();
        });

        document.getElementById('confirmPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitPassword();
        });
    </script>
</body>
</html>
{{end}}
