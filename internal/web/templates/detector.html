{{define "detector"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攻击检测管理 - WAF</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/css/detector.css">
</head>
<body>
    {{template "sidebar" .}}
    <div class="main scroll-page">
        <h2 style="margin-bottom: 20px; font-size: 20px; color: #2c3e50; flex-shrink: 0;">🛡️ 攻击检测管理</h2>
        <div class="detector-layout" id="detectorLayout"></div>
    </div>

    <div id="add-rule-modal" class="modal">
        <div class="modal-content" style="width:600px;">
            <div class="modal-header">
                <h3>添加自定义规则</h3>
                <span class="close" onclick="closeAddRuleModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>规则模式 (正则表达式)</label>
                    <input type="text" id="rule-pattern" class="config-input" placeholder="例如: (?i)\bunion\b.*\bselect\b">
                </div>
                <div class="form-group">
                    <label>规则描述</label>
                    <input type="text" id="rule-description" class="config-input" placeholder="例如: UNION注入检测">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeAddRuleModal()">取消</button>
                <button class="btn-submit" onclick="addRule()">添加</button>
            </div>
        </div>
    </div>

    <script nonce="{{.CSPNonce}}" src="/static/js/detector.js"></script>
</body>
</html>
{{end}}
