{{define "detector"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攻击检测管理 - WAF</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <style>
        .detector-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            background: white;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }
        .detector-tab {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: #f8f9fa;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #7f8c8d;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            position: relative;
        }
        .detector-tab:hover {
            background: #ecf0f1;
            color: #2c3e50;
        }
        .detector-tab.active {
            background: white;
            color: #1abc9c;
            border-bottom-color: #1abc9c;
        }
        .detector-tab .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
        }
        .detector-tab .badge.enabled {
            background: #d4edda;
            color: #155724;
        }
        .detector-tab .badge.disabled {
            background: #f8d7da;
            color: #721c24;
        }
        .detector-content {
            background: white;
            border-radius: 0 0 12px 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .detector-panel {
            display: none;
        }
        .detector-panel.active {
            display: block;
        }
        .config-section {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #f0f0f0;
        }
        .config-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .config-section h3 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .config-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .config-label {
            width: 140px;
            font-weight: 500;
            color: #2c3e50;
            font-size: 14px;
        }
        @media (max-width: 600px) {
            .config-label {
                width: 100%;
            }
        }
        .config-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .config-input:focus {
            outline: none;
            border-color: #1abc9c;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            display: inline-block;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1abc9c;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .rule-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .filter-btn:hover {
            background: #f5f5f5;
        }
        .filter-btn.active {
            background: #1abc9c;
            color: white;
            border-color: #1abc9c;
        }
        .rule-list {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fafafa;
        }
        .rule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
            transition: background 0.2s;
        }
        .rule-item:hover {
            background: #f0f0f0;
        }
        .rule-item:last-child {
            border-bottom: none;
        }
        .rule-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0;
            min-width: 0;
        }
        .rule-type-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 12px;
        }
        .rule-type-badge.builtin {
            background: #e3f2fd;
            color: #1976d2;
        }
        .rule-type-badge.custom {
            background: #fff3e0;
            color: #f57c00;
        }
        .rule-pattern {
            font-family: 'Courier New', monospace;
            color: #e74c3c;
            word-break: break-all;
            font-size: 12px;
            flex-shrink: 0;
            margin-right: 16px;
        }
        .rule-desc {
            color: #7f8c8d;
            font-size: 12px;
            font-weight: 500;
            flex: 1;
            min-width: 80px;
        }
        .rule-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
            margin-left: 16px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #1abc9c;
            color: white;
        }
        .btn-primary:hover {
            background: #16a085;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-outline {
            background: white;
            border: 1px solid #ddd;
            color: #7f8c8d;
        }
        .btn-outline:hover {
            background: #f5f5f5;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        .empty-message {
            text-align: center;
            padding: 20px;
            color: #95a5a6;
            font-size: 14px;
        }
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            flex: 1;
            min-width: 120px;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-item .label {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .stat-item .value {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
        }
        .sensitivity-btns {
            display: flex;
            gap: 8px;
        }
        .sensitivity-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .sensitivity-btn:hover {
            background: #f5f5f5;
        }
        .sensitivity-btn.active {
            background: #1abc9c;
            color: white;
            border-color: #1abc9c;
        }
        .rule-toggle {
            position: relative;
            width: 40px;
            height: 22px;
            display: inline-block;
        }
        .rule-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .rule-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 22px;
        }
        .rule-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .rule-slider {
            background-color: #1abc9c;
        }
        input:checked + .rule-slider:before {
            transform: translateX(18px);
        }
    </style>
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <h2 style="margin-bottom: 20px; font-size: 20px; color: #2c3e50;">🛡️ 攻击检测管理</h2>
        
        <!-- Tab切换 -->
        <div class="detector-tabs">
            <button class="detector-tab active" data-type="sql_injection">
                💉 SQL注入检测
                <span class="badge enabled" id="sql-badge">加载中</span>
            </button>
            <button class="detector-tab" data-type="xss">
                🎯 XSS攻击检测
                <span class="badge enabled" id="xss-badge">加载中</span>
            </button>
            <button class="detector-tab" data-type="command_injection">
                ⚙️ 命令注入检测
                <span class="badge enabled" id="cmd-badge">加载中</span>
            </button>
        </div>
        
        <!-- 内容区域 -->
        <div class="detector-content">
            <!-- SQL注入检测面板 -->
            <div class="detector-panel active" id="panel-sql_injection">
                <div class="config-section">
                    <h3>基本配置</h3>
                    <div class="config-row">
                        <div class="config-label">启用状态</div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="sql-enabled" onchange="toggleDetector('sql_injection', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="config-row">
                        <div class="config-label">敏感度级别</div>
                        <div class="sensitivity-btns">
                            <button class="sensitivity-btn" data-level="low" onclick="setSensitivity('sql_injection', 'low')">低</button>
                            <button class="sensitivity-btn active" data-level="medium" onclick="setSensitivity('sql_injection', 'medium')">中</button>
                            <button class="sensitivity-btn" data-level="high" onclick="setSensitivity('sql_injection', 'high')">高</button>
                        </div>
                    </div>
                </div>
                
                <div class="config-section">
                    <h3>白名单配置</h3>
                    <div class="config-row">
                        <div class="config-label">IP白名单</div>
                        <input type="text" class="config-input" id="sql-whitelist-ips" placeholder="多个IP用逗号分隔，如 192.168.1.1,10.0.0.0/8">
                    </div>
                    <div class="config-row">
                        <div class="config-label">路径白名单</div>
                        <input type="text" class="config-input" id="sql-whitelist-paths" placeholder="多个路径用逗号分隔，如 /api/health,/admin">
                    </div>
                    <div class="config-row">
                        <div class="config-label"></div>
                        <button class="btn btn-primary" onclick="saveConfig('sql_injection')">保存配置</button>
                    </div>
                </div>
                
                <div class="config-section">
                    <h3>检测规则 <span id="sql-rule-count">(加载中)</span></h3>
                    <div class="rule-filter">
                        <button class="filter-btn active" data-filter="all" onclick="filterRules('sql_injection', 'all')">全部</button>
                        <button class="filter-btn" data-filter="builtin" onclick="filterRules('sql_injection', 'builtin')">内置规则</button>
                        <button class="filter-btn" data-filter="custom" onclick="filterRules('sql_injection', 'custom')">自定义规则</button>
                    </div>
                    <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="sql-search" placeholder="搜索规则..." 
                               style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;flex:1;font-size:13px;"
                               oninput="searchRules('sql_injection', this.value)">
                        <button class="btn btn-outline btn-small" onclick="showAddRule('sql_injection')">+ 添加自定义规则</button>
                    </div>
                    <div class="rule-list" id="sql-rules">
                        <div class="empty-message">加载中...</div>
                    </div>
                </div>
            </div>
            
            <!-- XSS检测面板 -->
            <div class="detector-panel" id="panel-xss">
                <div class="config-section">
                    <h3>基本配置</h3>
                    <div class="config-row">
                        <div class="config-label">启用状态</div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="xss-enabled" onchange="toggleDetector('xss', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="config-row">
                        <div class="config-label">敏感度级别</div>
                        <div class="sensitivity-btns">
                            <button class="sensitivity-btn" data-level="low" onclick="setSensitivity('xss', 'low')">低</button>
                            <button class="sensitivity-btn active" data-level="medium" onclick="setSensitivity('xss', 'medium')">中</button>
                            <button class="sensitivity-btn" data-level="high" onclick="setSensitivity('xss', 'high')">高</button>
                        </div>
                    </div>
                </div>
                
                <div class="config-section">
                    <h3>白名单配置</h3>
                    <div class="config-row">
                        <div class="config-label">IP白名单</div>
                        <input type="text" class="config-input" id="xss-whitelist-ips" placeholder="多个IP用逗号分隔">
                    </div>
                    <div class="config-row">
                        <div class="config-label">路径白名单</div>
                        <input type="text" class="config-input" id="xss-whitelist-paths" placeholder="多个路径用逗号分隔">
                    </div>
                    <div class="config-row">
                        <div class="config-label"></div>
                        <button class="btn btn-primary" onclick="saveConfig('xss')">保存配置</button>
                    </div>
                </div>
                
                <div class="config-section">
                    <h3>检测规则 <span id="xss-rule-count">(加载中)</span></h3>
                    <div class="rule-filter">
                        <button class="filter-btn active" data-filter="all" onclick="filterRules('xss', 'all')">全部</button>
                        <button class="filter-btn" data-filter="builtin" onclick="filterRules('xss', 'builtin')">内置规则</button>
                        <button class="filter-btn" data-filter="custom" onclick="filterRules('xss', 'custom')">自定义规则</button>
                    </div>
                    <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="xss-search" placeholder="搜索规则..." 
                               style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;flex:1;font-size:13px;"
                               oninput="searchRules('xss', this.value)">
                        <button class="btn btn-outline btn-small" onclick="showAddRule('xss')">+ 添加自定义规则</button>
                    </div>
                    <div class="rule-list" id="xss-rules">
                        <div class="empty-message">加载中...</div>
                    </div>
                </div>
            </div>
            
            <!-- 命令注入检测面板 -->
            <div class="detector-panel" id="panel-command_injection">
                <div class="config-section">
                    <h3>基本配置</h3>
                    <div class="config-row">
                        <div class="config-label">启用状态</div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="cmd-enabled" onchange="toggleDetector('command_injection', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="config-row">
                        <div class="config-label">敏感度级别</div>
                        <div class="sensitivity-btns">
                            <button class="sensitivity-btn" data-level="low" onclick="setSensitivity('command_injection', 'low')">低</button>
                            <button class="sensitivity-btn active" data-level="medium" onclick="setSensitivity('command_injection', 'medium')">中</button>
                            <button class="sensitivity-btn" data-level="high" onclick="setSensitivity('command_injection', 'high')">高</button>
                        </div>
                    </div>
                </div>
                
                <div class="config-section">
                    <h3>白名单配置</h3>
                    <div class="config-row">
                        <div class="config-label">IP白名单</div>
                        <input type="text" class="config-input" id="cmd-whitelist-ips" placeholder="多个IP用逗号分隔">
                    </div>
                    <div class="config-row">
                        <div class="config-label">路径白名单</div>
                        <input type="text" class="config-input" id="cmd-whitelist-paths" placeholder="多个路径用逗号分隔">
                    </div>
                    <div class="config-row">
                        <div class="config-label"></div>
                        <button class="btn btn-primary" onclick="saveConfig('command_injection')">保存配置</button>
                    </div>
                </div>
                
                <div class="config-section">
                    <h3>检测规则 <span id="cmd-rule-count">(加载中)</span></h3>
                    <div class="rule-filter">
                        <button class="filter-btn active" data-filter="all" onclick="filterRules('command_injection', 'all')">全部</button>
                        <button class="filter-btn" data-filter="builtin" onclick="filterRules('command_injection', 'builtin')">内置规则</button>
                        <button class="filter-btn" data-filter="custom" onclick="filterRules('command_injection', 'custom')">自定义规则</button>
                    </div>
                    <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="cmd-search" placeholder="搜索规则..." 
                               style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;flex:1;font-size:13px;"
                               oninput="searchRules('command_injection', this.value)">
                        <button class="btn btn-outline btn-small" onclick="showAddRule('command_injection')">+ 添加自定义规则</button>
                    </div>
                    <div class="rule-list" id="cmd-rules">
                        <div class="empty-message">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加规则对话框 -->
    <div id="add-rule-modal" class="modal">
        <div class="modal-content" style="width:600px;">
            <div class="modal-header">
                <h3>添加自定义规则</h3>
                <span class="close" onclick="closeAddRuleModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>规则模式 (正则表达式)</label>
                    <input type="text" id="rule-pattern" class="config-input" placeholder="例如: (?i)\bunion\b.*\bselect\b">
                </div>
                <div class="form-group">
                    <label>规则描述</label>
                    <input type="text" id="rule-description" class="config-input" placeholder="例如: UNION注入检测">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeAddRuleModal()">取消</button>
                <button class="btn-submit" onclick="addRule()">添加</button>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            var currentDetectorType = 'sql_injection';
            var currentFilter = 'all';
            var configs = {};
            var rules = {};

            function escapeHtml(text) {
                if (text == null) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 加载所有配置
            function loadConfigs() {
                fetch('/api/detector/list')
                    .then(r => r.json())
                    .then(data => {
                        configs = {};
                        data.forEach(cfg => { configs[cfg.detector_type] = cfg; });
                        updateUI();
                        loadAllRules();
                    })
                    .catch(err => console.error('加载配置失败:', err));
            }

            function loadAllRules() {
                ['sql_injection', 'xss', 'command_injection'].forEach(type => loadRules(type));
            }

            function loadRules(type) {
                fetch('/api/detector/rules?type=' + type)
                    .then(r => r.json())
                    .then(data => {
                        rules[type] = data;
                        renderRules(type);
                    })
                    .catch(err => console.error('加载规则失败:', err));
            }

            function updateUI() {
                if (configs['sql_injection']) updateDetectorUI('sql_injection', configs['sql_injection']);
                if (configs['xss']) updateDetectorUI('xss', configs['xss']);
                if (configs['command_injection']) updateDetectorUI('command_injection', configs['command_injection']);
            }

            function updateDetectorUI(type, cfg) {
                var prefix = type === 'command_injection' ? 'cmd' : (type === 'sql_injection' ? 'sql' : type);
                var enabledEl = document.getElementById(prefix + '-enabled');
                if (enabledEl) enabledEl.checked = cfg.enabled;
                var badgeEl = document.getElementById(prefix + '-badge');
                if (badgeEl) {
                    badgeEl.textContent = cfg.enabled ? '已启用' : '已禁用';
                    badgeEl.className = 'badge ' + (cfg.enabled ? 'enabled' : 'disabled');
                }
                var btns = document.querySelectorAll('#panel-' + type + ' .sensitivity-btn');
                btns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.level === cfg.sensitivity_level) btn.classList.add('active');
                });
                var ipsEl = document.getElementById(prefix + '-whitelist-ips');
                if (ipsEl) ipsEl.value = cfg.whitelist_ips || '';
                var pathsEl = document.getElementById(prefix + '-whitelist-paths');
                if (pathsEl) pathsEl.value = cfg.whitelist_paths || '';
            }

            window.searchRules = function(type, keyword) {
                var prefix = type === 'command_injection' ? 'cmd' : (type === 'sql_injection' ? 'sql' : type);
                var container = document.getElementById(prefix + '-rules');
                var countEl = document.getElementById(prefix + '-rule-count');
                if (!container) return;
                var ruleList = rules[type] || [];
                var filteredRules = ruleList;
                if (currentFilter !== 'all') filteredRules = ruleList.filter(r => r.rule_type === currentFilter);
                if (keyword && keyword.trim()) {
                    keyword = keyword.toLowerCase().trim();
                    filteredRules = filteredRules.filter(rule => 
                        (rule.pattern && rule.pattern.toLowerCase().includes(keyword)) ||
                        (rule.description && rule.description.toLowerCase().includes(keyword))
                    );
                }
                var builtinCount = ruleList.filter(r => r.rule_type === 'builtin').length;
                var customCount = ruleList.filter(r => r.rule_type === 'custom').length;
                if (countEl) countEl.textContent = '(内置:' + builtinCount + '条 自定义:' + customCount + '条' + (keyword ? ' 搜索:' + filteredRules.length + '条' : '') + ')';
                if (filteredRules.length === 0) {
                    container.innerHTML = '<div class="empty-message">' + (keyword ? '未找到匹配的规则' : '暂无规则') + '</div>';
                    return;
                }
                container.innerHTML = '';
                filteredRules.forEach(rule => {
                    var item = document.createElement('div');
                    item.className = 'rule-item';
                    var actionsHtml = rule.rule_type === 'custom' ? '<button class="btn btn-danger btn-small" onclick="removeRule(' + rule.id + ', \'' + type + '\')">删除</button>' : '';
                    item.innerHTML = 
                        '<div class="rule-info">' +
                            '<span class="rule-type-badge ' + rule.rule_type + '">' + (rule.rule_type === 'builtin' ? '内置' : '自定义') + '</span>' +
                            '<code class="rule-pattern">' + escapeHtml(rule.pattern) + '</code>' +
                            '<span class="rule-desc">' + escapeHtml(rule.description || '未命名规则') + '</span>' +
                        '</div>' +
                        '<div class="rule-actions">' +
                            '<label class="rule-toggle">' +
                                '<input type="checkbox" ' + (rule.enabled ? 'checked' : '') + ' onchange="toggleRule(' + rule.id + ', this.checked)">' +
                                '<span class="rule-slider"></span>' +
                            '</label>' +
                            actionsHtml +
                        '</div>';
                    container.appendChild(item);
                });
            };

            function renderRules(type) {
                var prefix = type === 'command_injection' ? 'cmd' : (type === 'sql_injection' ? 'sql' : type);
                var searchEl = document.getElementById(prefix + '-search');
                searchRules(type, searchEl ? searchEl.value : '');
            }

            window.filterRules = function(type, filter) {
                currentFilter = filter;
                var btns = document.querySelectorAll('#panel-' + type + ' .filter-btn');
                btns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.filter === filter) btn.classList.add('active');
                });
                renderRules(type);
            };

            document.querySelectorAll('.detector-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.detector-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    var type = tab.dataset.type;
                    currentDetectorType = type;
                    currentFilter = 'all';
                    document.querySelectorAll('.detector-panel').forEach(p => p.classList.remove('active'));
                    document.getElementById('panel-' + type).classList.add('active');
                });
            });

            window.toggleDetector = function(type, enabled) {
                fetch('/api/detector/toggle', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ detector_type: type, enabled: enabled })
                })
                .then(r => r.json())
                .then(data => { if (data.status === 'ok') loadConfigs(); })
                .catch(err => console.error('Toggle error:', err));
            };

            window.setSensitivity = function(type, level) {
                var btns = document.querySelectorAll('#panel-' + type + ' .sensitivity-btn');
                btns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.level === level) btn.classList.add('active');
                });
            };

            window.saveConfig = function(type) {
                var prefix = type === 'command_injection' ? 'cmd' : (type === 'sql_injection' ? 'sql' : type);
                var cfg = configs[type] || {};
                var sensitivity = 'medium';
                var btns = document.querySelectorAll('#panel-' + type + ' .sensitivity-btn');
                btns.forEach(btn => { if (btn.classList.contains('active')) sensitivity = btn.dataset.level; });
                var whitelistIPs = document.getElementById(prefix + '-whitelist-ips').value;
                var whitelistPaths = document.getElementById(prefix + '-whitelist-paths').value;
                var saveBtn = document.querySelector('#panel-' + type + ' .btn-primary'); if (saveBtn) saveBtn.disabled = true;
                fetch('/api/detector/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        detector_type: type,
                        enabled: cfg.enabled,
                        sensitivity_level: sensitivity,
                        whitelist_ips: whitelistIPs,
                        whitelist_paths: whitelistPaths
                    })
                })
                .then(r => r.json())
                .then(data => { if (data.status === 'ok') loadConfigs(); })
                .catch(err => console.error('Save config error:', err))
                .finally(function() { if (saveBtn) saveBtn.disabled = false; });
            };

            window.showAddRule = function(type) {
                currentDetectorType = type;
                document.getElementById('add-rule-modal').classList.add('show');
                document.getElementById('rule-pattern').value = '';
                document.getElementById('rule-description').value = '';
                document.getElementById('rule-pattern').focus();
            };

            window.closeAddRuleModal = function() {
                document.getElementById('add-rule-modal').classList.remove('show');
            };

            window.addRule = function() {
                var pattern = document.getElementById('rule-pattern').value.trim();
                var description = document.getElementById('rule-description').value.trim();
                if (!pattern) { alert('请输入规则模式'); return; }
                var btn = document.querySelector('#add-rule-modal .btn-submit'); if (btn) btn.disabled = true;
                fetch('/api/detector/rule/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ detector_type: currentDetectorType, pattern: pattern, description: description })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'ok') {
                        closeAddRuleModal();
                        loadRules(currentDetectorType);
                    } else alert('添加失败');
                })
                .catch(err => alert('添加失败: ' + err))
                .finally(function() { if (btn) btn.disabled = false; });
            };

            window.removeRule = function(ruleID, type) {
                if (!confirm('确定要删除这条规则吗?')) return;
                fetch('/api/detector/rule/remove', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ rule_id: ruleID })
                })
                .then(r => r.json())
                .then(data => { if (data.status === 'ok') loadRules(type); else alert('删除失败'); })
                .catch(err => alert('删除失败: ' + err));
            };

            window.toggleRule = function(ruleID, enabled) {
                fetch('/api/detector/rule/toggle', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ rule_id: ruleID, enabled: enabled })
                })
                .then(r => r.json())
                .then(data => { if (data.status !== 'ok') { alert('操作失败'); loadAllRules(); } })
                .catch(err => { alert('操作失败: ' + err); loadAllRules(); });
            };

            loadConfigs();
            setInterval(loadConfigs, 30000);

            window.addEventListener('click', function(event) {
                var modal = document.getElementById('add-rule-modal');
                if (event.target == modal) closeAddRuleModal();
            });
        })();
    </script>
</body>
</html>
{{end}}
