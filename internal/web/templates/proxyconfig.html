{{define "proxyconfig"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理配置 - GoWAF</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/css/proxyconfig.css">
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
                <h3>代理配置列表</h3>
                <button class="btn btn-primary" onclick="showAddModal()">+ 添加代理</button>
            </div>
            <div class="list-container">
            <table>
                <thead><tr><th>监听地址</th><th>协议</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="proxyList"></tbody>
            </table>
            <div class="pagination" id="pagination" style="display:none;">
                <div class="pagination-info">
                    <span id="pageInfo">第1 页 / 第1 页</span>
                    <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                        <option value="5">5 条</option>
                        <option value="10" selected>10 条</option>
                        <option value="20">20 条</option>
                        <option value="50">50 条</option>
                    </select>
                </div>
                <div class="pagination-btns">
                    <button class="pagination-btn" id="prevBtn" onclick="prevPage()">上一页</button>
                    <button class="pagination-btn" id="nextBtn" onclick="nextPage()">下一页</button>
                </div>
            </div>
            </div>
        </div>
    </div>
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加代理</h3>
            </div>
            <div class="form-group">
                <label for="listenAddr">监听地址 *</label>
                <input type="text" id="listenAddr" placeholder=":80 或 :443" oninput="validateListenAddr()">
                <div class="hint">格式：端口 或 IP:端口，例如：80 或 0.0.0.0:443</div>
                <div class="error" id="addrError">请输入有效的监听地址</div>
            </div>
            <div class="form-group">
                <label>协议 <span class="hint-inline" id="protocolHint">HTTP+WS / HTTPS+WSS</span></label>
                <div class="protocol-checkboxes">
                    <label class="protocol-option"><input type="checkbox" id="protocolHttp" value="http" checked onchange="onProtocolChange()"> HTTP</label>
                    <label class="protocol-option"><input type="checkbox" id="protocolHttps" value="https" onchange="onProtocolChange()"> HTTPS</label>
                    <label class="protocol-option"><input type="checkbox" id="protocolWs" value="ws" onchange="onProtocolChange()"> WS</label>
                    <label class="protocol-option"><input type="checkbox" id="protocolWss" value="wss" onchange="onProtocolChange()"> WSS</label>
                </div>
                <div class="protocol-error" id="protocolError" style="display:none;"></div>
            </div>
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="enabled" checked>
                    <label for="enabled">启用</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveProxy()" id="saveBtn">保存</button>
            </div>
        </div>
    </div>
    <script nonce="{{.CSPNonce}}" src="/static/js/proxyconfig_page.js"></script>
</body>
</html>
{{end}}
