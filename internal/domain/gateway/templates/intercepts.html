{{define "intercepts"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拦截数据 - GoWAF</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/css/intercepts.css">
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <h2 style="margin-bottom: 20px; font-size: 20px; color: #2c3e50; flex-shrink: 0;">🛡️ 拦截数据</h2>

        <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="搜索IP、路径或规则类型..." onkeyup="filterTable()">
                <select id="typeFilter" onchange="filterTable()">
                    <option value="">全部拦截</option>
                    <option value="rule">规则拦截</option>
                    <option value="ip">IP黑名单</option>
                    <option value="ua">UA规则</option>
                    <option value="path">路径规则</option>
                    <option value="geo">地理规则</option>
                    <option value="method">HTTP方法限制</option>
                    <option value="ratelimit">限流拦截</option>
                    <option value="sql">SQL注入</option>
                    <option value="xss">XSS攻击</option>
                    <option value="cmd">命令注入</option>
                    <option value="path_traversal">路径遍历</option>
                    <option value="header_injection">头部注入</option>
                    <option value="sensitive_data">敏感数据</option>
                </select>
                <div class="view-mode-group" id="viewModeGroup">
                    <button class="view-mode-btn active" data-mode="detail" onclick="switchViewMode('detail')">明细视图</button>
                    <button class="view-mode-btn" data-mode="ip" onclick="switchViewMode('ip')">按IP</button>
                    <button class="view-mode-btn" data-mode="path" onclick="switchViewMode('path')">按路径</button>
                    <button class="view-mode-btn" data-mode="rule" onclick="switchViewMode('rule')">按规则</button>
                </div>
                <div class="time-filter">
                    <span>时间：</span>
                    <input type="date" id="startDate" onchange="filterTable()">
                    <span>至</span>
                    <input type="date" id="endDate" onchange="filterTable()">
                </div>
                <button onclick="clearFilters()">清除筛选</button>
                <button class="auto-refresh-btn" id="autoRefreshBtn" onclick="toggleAutoRefresh()">
                    <span class="ar-icon">⟳</span> <span id="arLabel">自动刷新</span>
                </button>
            </div>
            <div class="list-container">
            <table class="log-table" id="detailTable">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>IP地址</th>
                        <th>地理位置</th>
                        <th>请求方法</th>
                        <th>请求路径</th>
                        <th>规则类型</th>
                        <th>状态码</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div id="groupViewContainer" style="display:none;">
                <table class="group-table">
                    <thead id="groupThead"></thead>
                    <tbody id="groupBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="groupPagination" style="display:none;">
                <div class="pagination-info">
                    <span id="groupPageInfo">第1 页 / 第1 页</span>
                </div>
                <div class="pagination-btns">
                    <button class="pagination-btn" id="groupPrevBtn" onclick="groupPrevPage()">上一页</button>
                    <button class="pagination-btn" id="groupNextBtn" onclick="groupNextPage()">下一页</button>
                </div>
            </div>
            </div>
            <div class="pagination" id="pagination" style="display:none;">
                <span id="pageInfo" style="color:#888;font-size:13px;white-space:nowrap;"></span>
                <div class="pagination-btns" id="pageBtns"></div>
                <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                    <option value="20">20 条/页</option>
                    <option value="50" selected>50 条/页</option>
                    <option value="100">100 条/页</option>
                    <option value="200">200 条/页</option>
                </select>
            </div>
    </div>
    <script nonce="{{.CSPNonce}}" src="/static/js/log_autorefresh.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/log_detail.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/log_pagination.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/intercepts_table.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/intercepts_filter.js"></script>
</body>
</html>
{{end}}
