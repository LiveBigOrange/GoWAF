{{define "path"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路径规则 - GoWAF</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <style>
        .toggle-btn { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; user-select: none; }
        .toggle-btn.enabled { background: #e1f3d8; color: #67c23a; }
        .toggle-btn.disabled { background: #fde2e2; color: #f56c6c; }
        .edit-btn { padding: 4px 10px; background: #e6a23c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .edit-btn:hover { background: #ebb563; }
        table { table-layout: auto; }
        th:nth-child(1), td:nth-child(1) { white-space: nowrap; }
        th:nth-child(2), td:nth-child(2) { white-space: nowrap; }
        th:nth-child(5), td:nth-child(5) { white-space: nowrap; }
        th:nth-child(6), td:nth-child(6) { white-space: nowrap; }
        td code { word-break: break-all; font-size: 12px; }
        .badge.intel { background: #d1ecf1; color: #0c5460; }
        .intel-action-btn { padding: 4px 10px; background: #e6a23c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .intel-action-btn:hover { background: #ebb563; }
    </style>
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <div class="card list-card" style="flex:1;">
            <!-- 筛选栏 -->
            <div class="filter-bar">
                <select id="filterType" class="styled-select" onchange="filterData()">
                    <option value="">所有类型</option>
                    <option value="whitelist">白名单</option>
                    <option value="blacklist">黑名单</option>
                </select>
                <select id="filterMatch" class="styled-select" onchange="filterData()">
                    <option value="">所有匹配方式</option>
                    <option value="prefix">前缀匹配</option>
                    <option value="suffix">后缀匹配</option>
                    <option value="exact">精确匹配</option>
                    <option value="contains">包含匹配</option>
                    <option value="regex">正则表达式</option>
                </select>
                <select id="filterSource" class="styled-select" onchange="filterData()">
                    <option value="">所有来源</option>
                    <option value="builtin">内置</option>
                    <option value="manual">手动</option>
                </select>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchPattern" placeholder="搜索路径模式..." oninput="handleSearch()">
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
                </div>
                <button class="add-btn" onclick="openModal()">+ 添加规则</button>
            </div>

            <!-- 规则列表 -->
            <div class="list-container">
            <table>
                <thead>
                    <tr><th>类型</th><th>匹配方式</th><th>模式</th><th>来源</th><th>说明</th><th>状态</th><th>操作</th></tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            </div>
            <div class="pagination" id="pagination" style="display:none;">
                <span id="pageInfo" style="color:#888;font-size:13px;white-space:nowrap;"></span>
                <div class="pagination-btns" id="pageBtns"></div>
                <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                    <option value="5">5 条/页</option>
                    <option value="10" selected>10 条/页</option>
                    <option value="20">20 条/页</option>
                    <option value="50">50 条/页</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- 添加规则模态框 -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加路径规则</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>规则类型</label>
                        <select name="rule_type" id="ruleType" required>
                            <option value="whitelist">白名单</option>
                            <option value="blacklist">黑名单</option>
                        </select>
                        <small>白名单：允许访问；黑名单：禁止访问</small>
                    </div>
                    <div class="form-group">
                        <label>匹配方式</label>
                        <select name="match_type" id="matchType" required>
                            <option value="prefix">前缀匹配</option>
                            <option value="suffix">后缀匹配</option>
                            <option value="exact">精确匹配</option>
                            <option value="contains">包含匹配</option>
                            <option value="regex">正则表达式</option>
                        </select>
                        <small>前缀：匹配路径开头；后缀：匹配路径结尾；精确：完全匹配；包含：路径包含该字符串；正则：正则表达式匹配</small>
                    </div>
                    <div class="form-group">
                        <label>路径模式</label>
                        <input type="text" name="pattern" id="patternInput" placeholder="例如: /admin, .php, .env" required>
                        <small id="patternHint">请输入路径模式</small>
                    </div>
                    <div class="form-group">
                        <label>说明</label>
                        <input type="text" name="description" id="descriptionInput" placeholder="例如: 防止敏感文件泄露">
                        <small>描述此规则的用途，便于后续维护</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="button" class="btn-submit" onclick="submitForm()">添加</button>
            </div>
        </div>
    </div>
    
    <!-- 编辑规则弹窗 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑路径规则</h3>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>规则类型</label>
                    <select id="editRuleType">
                        <option value="whitelist">白名单</option>
                        <option value="blacklist">黑名单</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>匹配方式</label>
                    <select id="editMatchType">
                        <option value="prefix">前缀匹配</option>
                        <option value="suffix">后缀匹配</option>
                        <option value="exact">精确匹配</option>
                        <option value="contains">包含匹配</option>
                        <option value="regex">正则表达式</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>路径模式</label>
                    <input type="text" id="editPattern" required>
                </div>
                <div class="form-group">
                    <label>说明</label>
                    <input type="text" id="editDescription">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="editEnabled">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button type="button" class="btn-submit" onclick="submitEdit()">保存</button>
            </div>
        </div>
    </div>
    
    <script nonce="{{.CSPNonce}}" src="/static/js/log_pagination.js"></script>
    <script nonce="{{.CSPNonce}}">
        (function() {
            var allData = [];
            var filteredData = [];
            var currentPage = 1;
            var pageSize = 10;


            window.openModal = function() {
                document.getElementById('addModal').classList.add('show');
                document.getElementById('addForm').reset();
                updatePatternHint();
            };

            window.closeModal = function() {
                document.getElementById('addModal').classList.remove('show');
            };

            function updatePatternHint() {
                var matchType = document.getElementById('matchType').value;
                var hint = document.getElementById('patternHint');
                var hints = {
                    'prefix': '前缀匹配：路径以该字符串开头，例如 /admin',
                    'suffix': '后缀匹配：路径以该字符串结尾，例如：.php',
                    'exact': '精确匹配：路径完全相同，例如 /login.php',
                    'contains': '包含匹配：路径包含该字符串，例如 admin',
                    'regex': '正则表达式：使用正则表达式匹配，例如 ^/api/.*'
                };
                hint.textContent = hints[matchType] || '请输入路径模式';
            }

            document.getElementById('matchType').addEventListener('change', updatePatternHint);

            window.submitForm = function() {
                var pattern = document.getElementById('patternInput').value.trim();
                var matchType = document.getElementById('matchType').value;
                var ruleType = document.getElementById('ruleType').value;
                
                if (!pattern) {
                    showToast('error', '请输入路径模式');
                    return false;
                }
                
                // 验证正则表达式
                if (matchType === 'regex') {
                    var jsPattern = pattern.replace(/^\(\?[iI]\)/, '');
                    try {
                        new RegExp(jsPattern);
                    } catch (e) {
                        showToast('error', '正则表达式格式不正确: ' + e.message);
                        return false;
                    }
                }
                
                // 路径格式验证
                if (matchType === 'prefix' || matchType === 'exact') {
                    if (!pattern.startsWith('/')) {
                        showToast('error', '前缀匹配和精确匹配的路径应以 / 开头');
                        return false;
                    }
                }
                
                // 长度限制
                if (pattern.length > 2000) {
                    showToast('error', '路径模式长度不能超过2000字符');
                    return false;
                }
                
                // 提交表单
                var formData = new FormData();
                formData.append('rule_type', ruleType);
                formData.append('match_type', matchType);
                formData.append('pattern', pattern);
                formData.append('description', document.getElementById('descriptionInput').value.trim());
                formData.append('action', 'add');
                
                var btn = document.querySelector('#addModal .btn-submit'); btn.disabled = true;
                fetch('/path', {
                    method: 'POST',
                    body: formData
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        showToast('success', '添加成功');
                        closeModal();
                        loadData();
                    } else {
                        showToast('error', '添加失败: ' + (data.error || '未知错误'));
                    }
                })
                .catch(function(e) {
                    showToast('error', '添加失败: ' + e.message);
                })
                .finally(function() { btn.disabled = false; });
                
                return false;
            };

            window.handleSearch = function() {
                var searchInput = document.getElementById('searchPattern');
                var searchClear = document.getElementById('searchClear');
                
                if (searchInput.value.trim()) {
                    searchClear.classList.add('show');
                } else {
                    searchClear.classList.remove('show');
                }
                
                filterData();
            };

            window.clearSearch = function() {
                var searchInput = document.getElementById('searchPattern');
                var searchClear = document.getElementById('searchClear');
                
                searchInput.value = '';
                searchClear.classList.remove('show');
                filterData();
                searchInput.focus();
            };

            window.filterData = function() {
                var filterType = document.getElementById('filterType').value;
                var filterMatch = document.getElementById('filterMatch').value;
                var filterSource = document.getElementById('filterSource').value;
                var searchText = document.getElementById('searchPattern').value.toLowerCase().trim();
                
                filteredData = allData.filter(function(item) {
                    if (filterType && item.rule_type !== filterType) return false;
                    if (filterMatch && item.match_type !== filterMatch) return false;
                    if (filterSource) {
                        var s = item.source || 'manual';
                        var group = s === 'intel' || s === 'intel-bot' || s === 'intel-sig' ? 'intel' : s;
                        if (group !== filterSource) return false;
                    }
                    if (searchText && item.pattern.toLowerCase().indexOf(searchText) === -1) return false;
                    return true;
                });
                
                currentPage = 1;
                renderData();
            }

            window.deletePath = function(ruleType, path) {
                WAF.confirmDelete('确认删除？','/api/path/delete',{rule_type:ruleType,pattern:path},loadData);
            };

            function loadData() {
                fetch('/api/path')
                    .then(function(r) { return r.json(); })
                    .then(function(resp) {
                        allData = resp.data || [];
                        filterData();
                    })
                    .catch(function(e) { showToast('error','加载数据失败'); });
            }

            function getMatchTypeText(type) {
                var map = { 'prefix': '前缀', 'suffix': '后缀', 'exact': '精确', 'contains': '包含', 'regex': '正则' };
                return map[type] || type;
            }

            function renderData() {
                var tbody = document.getElementById('tableBody');
                var pagination = document.getElementById('pagination');
                
                if (!filteredData || filteredData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#95a5a6; padding:20px;">暂无规则，请添加</td></tr>';
                    pagination.style.display = 'none';
                    return;
                }
                
                var totalPages = Math.ceil(filteredData.length / pageSize);
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;
                
                var start = (currentPage - 1) * pageSize;
                var end = Math.min(start + pageSize, filteredData.length);
                var pageData = filteredData.slice(start, end);
                
                tbody.innerHTML = '';
                pageData.forEach(function(item) {
                    var tr = document.createElement('tr');
                    var ruleTypeText = item.rule_type === 'whitelist' ? '白名单' : '黑名单';
                    var escapedPattern = escapeHtml(item.pattern);
                    var ruleTypeClass = item.rule_type === 'whitelist' ? 'whitelist' : 'blacklist';
                    var source = item.source || 'manual';
                    var sourceLabel = source === 'intel' || source === 'intel-bot' || source === 'intel-sig' ? '情报' : source === 'builtin' ? '内置' : '手动';
                    var sourceClass = source === 'intel' || source === 'intel-bot' || source === 'intel-sig' ? 'intel' : source === 'builtin' ? 'whitelist' : 'blacklist';
                    tr.innerHTML = '<td><span class="badge ' + ruleTypeClass + '">' + ruleTypeText + '</span></td>' +
                        '<td><span class="match-type">' + getMatchTypeText(item.match_type) + '</span></td>' +
                        '<td><code>' + escapedPattern + '</code></td>' +
                        '<td><span class="badge ' + sourceClass + '">' + sourceLabel + '</span></td>' +
                        '<td style="color:#909399;font-size:13px;">' + escapeHtml(item.description || '') + '</td>' +
                        '<td><span class="toggle-btn ' + (item.enabled ? 'enabled' : 'disabled') + '" onclick="toggleRule(' + item.id + ')">' + (item.enabled ? '启用' : '禁用') + '</span></td>' +
                        '<td><button class="edit-btn" onclick="openEditModal(' + item.id + ')">编辑</button> <button class="delete-btn" data-ruletype="' + escapeHtml(item.rule_type) + '" data-path="' + escapeHtml(item.pattern) + '">删除</button></td>';
                    tbody.appendChild(tr);
                });

                tbody.querySelectorAll('.delete-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var ruleType = this.dataset.ruletype;
                        var path = this.dataset.path;
                        if (ruleType && path) {
                            deletePath(ruleType, path);
                        }
                    });
                });
                
                if (totalPages <= 1) {
                    pagination.style.display = 'none';
                } else {
                    document.getElementById('pageInfo').textContent = '共 ' + filteredData.length + ' 条';
                    RenderPageBtns('pageBtns', currentPage, totalPages, 'goPage');
                    pagination.style.display = 'flex';
                }
            }

            window.goPage = function(p) { var total = Math.ceil(filteredData.length / pageSize); if (p < 1) p = 1; if (p > total) p = total; currentPage = p; renderData(); };

            window.changePageSize = function() { pageSize = parseInt(document.getElementById('pageSize').value); currentPage = 1; renderData(); };

            window.addEventListener('click', function(event) {
                if (event.target == document.getElementById('addModal')) closeModal();
                if (event.target == document.getElementById('editModal')) closeEditModal();
            });

            // [封存] 情报规则禁用功能暂时禁用
            // window.disableIntelPath = function(intelId) {
            //     if (!intelId) return;
            //     WAF.confirmAction('确认禁用此情报规则？', '/api/intel/rules/path/disable', {intel_id: intelId}, '已禁用', function() { loadData(); });
            // };

            loadData();

            window.openEditModal = function(id) {
                var item = allData.find(function(r) { return r.id === id; });
                if (!item) return;
                document.getElementById('editRuleType').value = item.rule_type;
                document.getElementById('editMatchType').value = item.match_type;
                document.getElementById('editPattern').value = item.pattern;
                document.getElementById('editDescription').value = item.description || '';
                document.getElementById('editEnabled').value = item.enabled ? '1' : '0';
                document.getElementById('editModal').classList.add('show');
                window._editRuleId = id;
            };
            window.closeEditModal = function() {
                document.getElementById('editModal').classList.remove('show');
                window._editRuleId = 0;
            };
            window.submitEdit = function() {
                var data = {
                    id: window._editRuleId,
                    rule_type: document.getElementById('editRuleType').value,
                    match_type: document.getElementById('editMatchType').value,
                    pattern: document.getElementById('editPattern').value.trim(),
                    description: document.getElementById('editDescription').value.trim(),
                    enabled: document.getElementById('editEnabled').value === '1'
                };
                if (!data.pattern) { showToast('error', '路径模式不能为空'); return; }
                fetch('/api/path/update', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) })
                    .then(r => r.json()).then(d => {
                        if (d.success) { showToast('success', '更新成功'); closeEditModal(); loadData(); }
                        else showToast('error', '更新失败');
                    }).catch(e => showToast('error', '更新失败: ' + e.message));
            };
            window.toggleRule = function(id) {
                fetch('/api/path/toggle?id=' + id, { method: 'POST' })
                    .then(r => r.json()).then(d => {
                        if (d.success) loadData();
                        else showToast('error', '切换失败');
                    }).catch(e => showToast('error', '切换失败'));
            };
        })();
    </script>
</body>
</html>
{{end}}
