{{define "httpmethods"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP方法限制 - GoWAF</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <style>
        .method-tag { display: inline-block; padding: 4px 12px; border-radius: 4px; font-weight: 600; font-size: 13px; background: #ecf0f1; color: #2c3e50; }
    </style>
</head>
<body>
    {{template "sidebar" .}}
    <div class="main scroll-page">
        <div class="card">
            <div class="info-box">仅允许列出的HTTP方法访问，未列出的方法将被拒绝（405）。留空则允许所有方法。</div>
            <div class="filter-bar">
                <button class="add-btn" onclick="openModal()">+ 添加方法</button>
            </div>
            <table>
                <thead><tr><th>HTTP方法</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="methodList"><tr><td colspan="3" style="text-align:center;color:#95a5a6;">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加允许的 HTTP 方法</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>方法名</label>
                    <select id="addMethod">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="PATCH">PATCH</option>
                        <option value="HEAD">HEAD</option>
                        <option value="OPTIONS">OPTIONS</option>
                    </select>
                    <small>选择要允许的HTTP方法</small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-submit" onclick="addMethod()">添加</button>
            </div>
        </div>
    </div>
    <script nonce="{{.CSPNonce}}">
    function loadMethods(){
        WAF.withLoading('.card',function(){
            return fetch('/api/methods/list').then(r=>r.json()).then(d=>{
                if(!d.success) return;
                var tbody=document.getElementById('methodList');
                if(!d.data||!d.data.length){tbody.innerHTML='<tr><td colspan="3" style="text-align:center;color:#95a5a6;">暂无限制（允许所有方法）</td></tr>';return;}
                tbody.innerHTML=d.data.map(m=>'<tr><td><span class="method-tag">'+escapeHtml(m.method)+'</span></td><td>'+WAF.renderEnabledText(m.enabled)+'</td><td><button class="delete-btn" data-method="'+escapeHtml(m.method)+'">删除</button></td></tr>').join('');
            }).catch(e=>showToast('error','加载方法列表失败'));
        });
    }
    document.getElementById('methodList').addEventListener('click',function(e){
        var btn=e.target.closest('.delete-btn');
        if(!btn)return;
        var method=btn.getAttribute('data-method');
        if(!method)return;
        WAF.confirmDelete('确认删除方法 '+method+'？','/api/methods/delete?method='+encodeURIComponent(method),{},loadMethods);
    });
    function openModal(){document.getElementById('addMethod').selectedIndex=0;WAF.Modal.open('addModal');}
    function closeModal(){WAF.Modal.close('addModal');}
    function addMethod(){
        WAF.submitWithLock('#addModal .btn-submit',function(){
            var method=document.getElementById('addMethod').value;
            return WAF.jsonPost('/api/methods/set',{method:method,enabled:true}).then(d=>{
                if(d.success){showToast('success','添加成功');closeModal();loadMethods();}else showToast('error',d.error||'添加失败');
            }).catch(e=>showToast('error','添加失败'));
        });
    }
    WAF.Modal.clickOutside('addModal',closeModal);
    loadMethods();
    </script>
</body>
</html>
{{end}}
