{{define "rules"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP规则 - GoWAF</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <style>
        .status-toggle { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; transition: all 0.3s; }
        .status-on { background: #d4edda; color: #155724; }
        .status-on:hover { background: #c3e6cb; }
        .status-off { background: #f8d7da; color: #721c24; }
        .status-off:hover { background: #f5c6cb; }
        .badge.intel { background: #d1ecf1; color: #0c5460; }
        .intel-action-btn { padding: 4px 10px; background: #e6a23c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .intel-action-btn:hover { background: #ebb563; }
    </style>
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <div class="card list-card" style="flex:1;">
            <!-- 筛选栏 -->
            <div class="filter-bar">
                <select id="filterType" class="styled-select" onchange="filterData()">
                    <option value="">所有类型</option>
                    <option value="whitelist">白名单</option>
                    <option value="blacklist">黑名单</option>
                </select>
                <select id="filterSource" class="styled-select" onchange="filterData()">
                    <option value="">所有来源</option>
                    <option value="builtin">内置</option>
                    <option value="manual">手动</option>
                </select>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchIP" placeholder="搜索IP地址..." oninput="handleSearch()">
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
                </div>
                <button class="add-btn" onclick="openModal()">+ 添加规则</button>
            </div>

            <!-- 规则列表 -->
            <div class="list-container">
            <table>
                <thead>
                    <tr><th>类型</th><th>IP地址</th><th>来源</th><th>状态</th><th>操作</th></tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            </div>
            <div class="pagination" id="pagination" style="display:none;">
                <span id="pageInfo" style="color:#888;font-size:13px;white-space:nowrap;"></span>
                <div class="pagination-btns" id="pageBtns"></div>
                <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                    <option value="5">5 条/页</option>
                    <option value="10" selected>10 条/页</option>
                    <option value="20">20 条/页</option>
                    <option value="50">50 条/页</option>
                </select>
            </div>
            </div>
        </div>
    </div>
    
    <!-- 添加规则模态框 -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加IP规则</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>规则类型</label>
                        <select name="rule_type" id="ruleType" required>
                            <option value="blacklist">黑名单</option>
                            <option value="whitelist">白名单</option>
                        </select>
                        <small>黑名单：禁止访问；白名单：允许访问（优先级高于黑名单）</small>
                    </div>
                    <div class="form-group">
                        <label>IP地址</label>
                        <input type="text" name="ip" id="ipInput" placeholder="例如: 192.168.1.1 或 10.0.0.0/24" required>
                        <small>支持单个IP地址或CIDR格式，例：192.168.1.1 或 10.0.0.0/24</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="button" class="btn-submit" onclick="submitForm()">添加</button>
            </div>
        </div>
    </div>
    
    <script nonce="{{.CSPNonce}}" src="/static/js/log_pagination.js"></script>
    <script nonce="{{.CSPNonce}}">
        (function() {
            var allData = [];
            var filteredData = [];
            var currentPage = 1;
            var pageSize = 10;


            window.openModal = function() {
                document.getElementById('addModal').classList.add('show');
                document.getElementById('addForm').reset();
            };

            window.closeModal = function() {
                document.getElementById('addModal').classList.remove('show');
            };

            window.submitForm = function() {
                var btn = document.querySelector('.btn-submit');
                if (btn.disabled) return false;
                var ip = document.getElementById('ipInput').value.trim();
                var ruleType = document.getElementById('ruleType').value;
                
                if (!ip) {
                    showToast('error','请输入IP地址');
                    return false;
                }
                
                var ipv4Regex = /^(\d{1,3}\.){3}\d{1,3}$/;
                var cidrRegex = /^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$/;
                var ipv6Regex = /^[0-9a-fA-F:]+$/;
                var ipv6CidrRegex = /^[0-9a-fA-F:]+\/\d{1,3}$/;
                
                if (!ipv4Regex.test(ip) && !cidrRegex.test(ip) && !ipv6Regex.test(ip) && !ipv6CidrRegex.test(ip)) {
                    showToast('error','IP地址格式不正确，请输入如：192.168.1.1、10.0.0.0/24 或 ::1、2001:db8::/32');
                    return false;
                }
                
                if (ipv4Regex.test(ip) || cidrRegex.test(ip)) {
                    var ipPart = ip.split('/')[0];
                    var parts = ipPart.split('.');
                    for (var i = 0; i < parts.length; i++) {
                        var num = parseInt(parts[i]);
                        if (num < 0 || num > 255) {
                            showToast('error','IP地址各段必须在0-255之间');
                            return false;
                        }
                    }
                    if (cidrRegex.test(ip)) {
                        var mask = parseInt(ip.split('/')[1]);
                        if (mask < 0 || mask > 32) {
                            showToast('error','CIDR掩码必须在0-32之间');
                            return false;
                        }
                    }
                }
                
                var formData = new FormData();
                formData.append('rule_type', ruleType);
                formData.append('ip', ip);
                
                btn.disabled = true;
                fetch('/rules', {
                    method: 'POST',
                    body: formData
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        closeModal();
                        loadData();
                    } else {
                        showToast('error','添加失败: ' + (data.error || '未知错误'));
                    }
                })
                .catch(function(e) {
                    showToast('error','添加失败: ' + e.message);
                })
                .finally(function() {
                    btn.disabled = false;
                });
                
                return false;
            };

            window.handleSearch = function() {
                var searchInput = document.getElementById('searchIP');
                var searchClear = document.getElementById('searchClear');
                
                if (searchInput.value.trim()) {
                    searchClear.classList.add('show');
                } else {
                    searchClear.classList.remove('show');
                }
                
                filterData();
            };

            window.clearSearch = function() {
                var searchInput = document.getElementById('searchIP');
                var searchClear = document.getElementById('searchClear');
                
                searchInput.value = '';
                searchClear.classList.remove('show');
                filterData();
                searchInput.focus();
            };

            window.filterData = function() {
                var filterType = document.getElementById('filterType').value;
                var filterSource = document.getElementById('filterSource').value;
                var searchText = document.getElementById('searchIP').value.toLowerCase().trim();
                
                filteredData = allData.filter(function(item) {
                    if (filterType && item.rule_type !== filterType) return false;
                    if (filterSource) {
                        var s = item.source || 'manual';
                        var group = s === 'intel' || s === 'intel-bot' || s === 'intel-sig' ? 'intel' : s;
                        if (group !== filterSource) return false;
                    }
                    if (searchText && item.ip.toLowerCase().indexOf(searchText) === -1) return false;
                    return true;
                });
                
                currentPage = 1;
                renderData();
            }

            window.deleteRule = function(ruleType, ip) {
                WAF.confirmDelete('确认删除？','/api/rules/ip/delete',{type:ruleType,ip:ip},loadData);
            };

            window.toggleRule = function(ruleType, ip, enabled) {
                fetch('/api/rules/ip/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: ruleType, ip: ip, enabled: enabled })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {showToast('success','状态已切换');loadData();}
                    else showToast('error','操作失败: ' + (data.error || '未知错误'));
                })
                .catch(function(e) { showToast('error','操作失败: ' + e.message); });
            };

            function loadData() {
                fetch('/api/rules')
                    .then(function(r) { return r.json(); })
                    .then(function(resp) {
                        allData = resp.data || [];
                        filterData();
                    })
                    .catch(function(e) { showToast('error','加载数据失败'); });
            }

            function renderData() {
                var tbody = document.getElementById('tableBody');
                var pagination = document.getElementById('pagination');
                
                if (!filteredData || filteredData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#95a5a6; padding:20px;">暂无规则，请添加</td></tr>';
                    pagination.style.display = 'none';
                    return;
                }
                
                var totalPages = Math.ceil(filteredData.length / pageSize);
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;
                
                var start = (currentPage - 1) * pageSize;
                var end = Math.min(start + pageSize, filteredData.length);
                var pageData = filteredData.slice(start, end);
                
                tbody.innerHTML = '';
                pageData.forEach(function(item) {
                    var tr = document.createElement('tr');
                    var ruleTypeText = item.rule_type === 'whitelist' ? '白名单' : '黑名单';
                    var escapedIP = escapeHtml(item.ip);
                    var enabled = item.enabled !== false;
                    var statusText = enabled ? '已启用' : '已禁用';
                    var statusClass = enabled ? 'status-on' : 'status-off';
                    var ruleTypeClass = item.rule_type === 'whitelist' ? 'whitelist' : 'blacklist';
                    var source = item.source || 'manual';
                    var sourceLabel = source === 'intel' || source === 'intel-bot' || source === 'intel-sig' ? '情报' : source === 'builtin' ? '内置' : '手动';
                    var sourceClass = source === 'intel' || source === 'intel-bot' || source === 'intel-sig' ? 'intel' : source === 'builtin' ? 'whitelist' : 'blacklist';
                    tr.innerHTML = '<td><span class="badge ' + ruleTypeClass + '">' + ruleTypeText + '</span></td>' +
                        '<td><code>' + escapedIP + '</code></td>' +
                        '<td><span class="badge ' + sourceClass + '">' + sourceLabel + '</span></td>' +
                        '<td><span class="status-toggle ' + statusClass + '" data-type="' + escapeHtml(item.rule_type) + '" data-ip="' + escapeHtml(item.ip) + '" data-enabled="' + enabled + '">' + statusText + '</span></td>' +
                        '<td><button class="delete-btn" data-ruletype="' + escapeHtml(item.rule_type) + '" data-ip="' + escapeHtml(item.ip) + '">删除</button></td>';
                    tbody.appendChild(tr);
                });

                tbody.querySelectorAll('.delete-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var ruleType = this.dataset.ruletype;
                        var ip = this.dataset.ip;
                        if (ruleType && ip) {
                            deleteRule(ruleType, ip);
                        }
                    });
                });

                tbody.querySelectorAll('.status-toggle').forEach(function(toggle) {
                    toggle.addEventListener('click', function() {
                        var ruleType = this.dataset.type;
                        var ip = this.dataset.ip;
                        var currentlyEnabled = this.dataset.enabled === 'true';
                        if (ruleType && ip) {
                            toggleRule(ruleType, ip, !currentlyEnabled);
                        }
                    });
                });
                
                if (totalPages <= 1) {
                    pagination.style.display = 'none';
                } else {
                    document.getElementById('pageInfo').textContent = '共 ' + filteredData.length + ' 条';
                    RenderPageBtns('pageBtns', currentPage, totalPages, 'goPage');
                    pagination.style.display = 'flex';
                }
            }

            window.goPage = function(p) { var total = Math.ceil(filteredData.length / pageSize); if (p < 1) p = 1; if (p > total) p = total; currentPage = p; renderData(); };

            window.changePageSize = function() { pageSize = parseInt(document.getElementById('pageSize').value); currentPage = 1; renderData(); };

            window.addEventListener('click', function(event) {
                var modal = document.getElementById('addModal');
                if (event.target == modal) closeModal();
            });

            // [封存] 情报规则禁用功能暂时禁用
            // window.disableIntelIP = function(intelId) {
            //     if (!intelId) return;
            //     WAF.confirmAction('确认禁用此情报规则？', '/api/intel/rules/ip/disable', {intel_id: intelId}, '已禁用', function() { loadData(); });
            // };

            loadData();
        })();
    </script>
</body>
</html>
{{end}}
