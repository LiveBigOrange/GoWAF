{{define "backend"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端服务 - GoWAF</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/css/backend.css">
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <div class="backend-layout">
            <div class="group-panel" id="groupPanel">
                <div class="group-panel-header">
                    <span>服务组</span>
                    <button class="panel-toggle-btn" onclick="toggleGroupPanel()" title="收起面板">◀</button>
                </div>
                <div class="group-panel-body" id="groupPanelBody">
                    <div class="group-list" id="groupList"></div>
                    <div class="group-add-section">
                        <button class="group-add-btn" id="groupAddBtn" onclick="openAddGroupModal()">+ 添加服务组</button>
                    </div>
                </div>
            </div>
            <div class="group-panel-collapsed" id="groupPanelCollapsed" style="display:none;">
                <button class="panel-expand-btn" onclick="toggleGroupPanel()" title="展开面板">▶</button>
                <div class="collapsed-group-list" id="collapsedGroupList"></div>
            </div>
            <div class="backend-panel" id="backendPanel">
                <div class="backend-toolbar">
                    <span></span>
                    <button class="btn btn-primary" onclick="openModal()">+ 添加后端</button>
                </div>
                <div class="card" style="flex:1;min-height:0;">
                    <div class="list-container">
                        <table>
                            <thead>
                                <tr><th>备注</th><th>后端地址</th><th>协议</th><th>所属组</th><th>权重</th><th>健康状态</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination">
                        <span id="pageInfo" style="color:#888;font-size:13px;white-space:nowrap;"></span>
                        <div class="pagination-btns" id="pageBtns"></div>
                        <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                            <option value="5">5 条/页</option>
                            <option value="10" selected>10 条/页</option>
                            <option value="20">20 条/页</option>
                            <option value="50">50 条/页</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">添加后端服务</h2>
            </div>
            <form id="addForm">
                <div class="form-group">
                    <label for="backendName">备注 <span class="hint-inline">(可选)</span></label>
                    <input type="text" id="backendName" name="name" placeholder="例如: 生产环境API">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="backendAddress">后端地址 * <span class="hint-inline">格式 host:port</span></label>
                        <input type="text" id="backendAddress" name="address" required placeholder="例如: 192.168.1.100:8080">
                    </div>
                    <div class="form-group">
                        <label for="backendWeight">权重 <span class="hint-inline">默认1</span></label>
                        <input type="number" id="backendWeight" name="weight" value="1" min="1" max="100">
                    </div>
                </div>
                <div class="form-group">
                    <label>协议 * <span class="hint-inline" id="schemeHint">HTTP+WS / HTTPS+WSS</span></label>
                    <div class="scheme-checkboxes">
                        <label class="scheme-option"><input type="checkbox" id="schemeHttp" value="http" checked onchange="onSchemeChange()"> HTTP</label>
                        <label class="scheme-option"><input type="checkbox" id="schemeHttps" value="https" onchange="onSchemeChange()"> HTTPS</label>
                        <label class="scheme-option"><input type="checkbox" id="schemeWs" value="ws" onchange="onSchemeChange()"> WS</label>
                        <label class="scheme-option"><input type="checkbox" id="schemeWss" value="wss" onchange="onSchemeChange()"> WSS</label>
                    </div>
                    <div class="scheme-error" id="schemeError" style="display:none;"></div>
                </div>
                <div class="section-divider"></div>
                <div class="form-group">
                    <div class="scheme-checkboxes" style="justify-content:center;">
                        <label class="scheme-option" style="min-width:140px;justify-content:center;">
                            <input type="checkbox" id="healthCheck" name="health_check" checked> 启用健康检查
                        </label>
                    </div>
                </div>
                <div id="healthCheckConfig">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="checkPath">健康检查路径</label>
                            <input type="text" id="checkPath" name="check_path" value="/health" placeholder="/health">
                        </div>
                        <div class="form-group">
                            <label for="checkInterval">检查间隔(秒)</label>
                            <input type="number" id="checkInterval" name="check_interval" value="10" min="5" max="300">
                        </div>
                        <div class="form-group">
                            <label for="checkTimeout">超时(秒)</label>
                            <input type="number" id="checkTimeout" name="check_timeout" value="5" min="1" max="60">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="failThreshold">失败阈值</label>
                            <input type="number" id="failThreshold" name="fail_threshold" value="3" min="1" max="10">
                        </div>
                        <div class="form-group">
                            <label for="recoverThreshold">恢复阈值</label>
                            <input type="number" id="recoverThreshold" name="recover_threshold" value="2" min="1" max="10">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="editGroupModal">
        <div class="modal-content" style="width:400px;">
            <div class="modal-header">
                <h2>编辑服务组</h2>
            </div>
            <form id="editGroupForm">
                <div class="form-group">
                    <label for="editGroupName">组名称 *</label>
                    <input type="text" id="editGroupName" required placeholder="组名称">
                </div>
                <div class="form-group">
                    <label for="editGroupLbPolicy">负载均衡策略</label>
                    <select id="editGroupLbPolicy">
                        <option value="round_robin">轮询</option>
                        <option value="weighted_round_robin">加权轮询</option>
                        <option value="least_connections">最少连接</option>
                        <option value="ip_hash">IP Hash</option>
                        <option value="url_hash">URL Hash</option>
                        <option value="random">加权随机</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="toggle-label">
                        <label class="group-toggle-switch"><input type="checkbox" id="editGroupEnabled"><span class="group-toggle-slider"></span></label>
                        <span id="editGroupEnabledText">已启用</span>
                    </label>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEditGroupModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="addGroupModal">
        <div class="modal-content" style="width:400px;">
            <div class="modal-header">
                <h2>添加服务组</h2>
            </div>
            <form id="addGroupForm">
                <div class="form-group">
                    <label for="addGroupName">组名称 *</label>
                    <input type="text" id="addGroupName" required placeholder="组名称">
                </div>
                <div class="form-group">
                    <label for="addGroupLbPolicy">负载均衡策略</label>
                    <select id="addGroupLbPolicy">
                        <option value="round_robin">轮询</option>
                        <option value="weighted_round_robin" selected>加权轮询</option>
                        <option value="least_connections">最少连接</option>
                        <option value="ip_hash">IP Hash</option>
                        <option value="url_hash">URL Hash</option>
                        <option value="random">加权随机</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAddGroupModal()">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>

    <script nonce="{{.CSPNonce}}" src="/static/js/log_pagination.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/backend.js"></script>
</body>
</html>
{{end}}
