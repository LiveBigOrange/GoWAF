{{define "adminlog"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理日志 - GoWAF</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/css/adminlog.css">
</head>
<body>
    {{template "sidebar" .}}
    <div class="main">
        <h2 style="margin-bottom: 20px; font-size: 20px; color: #2c3e50; flex-shrink: 0;">📋 管理日志</h2>
        
        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="label">总记录数</div>
                <div class="value" id="totalCount">-</div>
            </div>
            <div class="stat-card">
                <div class="label">登录成功</div>
                <div class="value" id="loginSuccessCount" style="color: #28a745;">-</div>
            </div>
            <div class="stat-card">
                <div class="label">登录失败</div>
                <div class="value" id="loginFailCount" style="color: #dc3545;">-</div>
            </div>
            <div class="stat-card">
                <div class="label">API 调用</div>
                <div class="value" id="apiCallCount" style="color: #007bff;">-</div>
            </div>
        </div>
        
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <select id="filterAction" onchange="applyFilters()">
                <option value="">所有操作</option>
                <option value="login_page">登录页面</option>
                <option value="login_success">登录成功</option>
                <option value="login_fail">登录失败</option>
                <option value="logout">登出</option>
                <option value="api_call">API调用</option>
                <option value="page_view">页面访问</option>
                <option value="captcha">验证码</option>
                <option value="unauthorized">未授权</option>
                <option value="forbidden">禁止访问</option>
            </select>
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">所有状态</option>
                <option value="2xx">2xx 成功</option>
                <option value="3xx">3xx 重定向</option>
                <option value="4xx">4xx 客户端错误</option>
                <option value="5xx">5xx 服务器错误</option>
                <option value="200">200</option>
                <option value="301">301</option>
                <option value="302">302</option>
                <option value="304">304</option>
                <option value="400">400</option>
                <option value="401">401</option>
                <option value="403">403</option>
                <option value="404">404</option>
                <option value="500">500</option>
                <option value="502">502</option>
                <option value="503">503</option>
            </select>
            <input type="text" id="filterIP" placeholder="筛选IP地址" oninput="applyFilters()" style="width: 150px; max-width: 100%;">
            <input type="text" id="filterPath" placeholder="筛选路径" oninput="applyFilters()" style="width: 200px; max-width: 100%;">
            <button class="btn btn-primary" onclick="loadLogs()" style="padding: 8px 16px; background: #409eff; color: white; border: none; border-radius: 4px; cursor: pointer;">刷新</button>
            <button class="btn" onclick="exportLogs()" style="padding: 8px 16px; background: #67c23a; color: white; border: none; border-radius: 4px; cursor: pointer;">导出</button>
            <button class="auto-refresh-btn active" id="autoRefreshBtn" onclick="toggleAutoRefresh()">
                <span class="ar-icon">⟳</span> <span id="arLabel">自动刷新 30s</span>
            </button>
            <div class="view-mode-group" id="viewModeGroup">
                <button class="view-mode-btn active" data-mode="detail" onclick="switchViewMode('detail')">明细视图</button>
                <button class="view-mode-btn" data-mode="ip" onclick="switchViewMode('ip')">按IP</button>
                <button class="view-mode-btn" data-mode="action" onclick="switchViewMode('action')">按操作</button>
                <button class="view-mode-btn" data-mode="status" onclick="switchViewMode('status')">按状态码</button>
            </div>
        </div>
        
        <!-- 日志表格 -->
        <div class="list-container">
        <table class="log-table" id="detailTable">
            <thead>
                <tr>
                    <th>时间</th>
                    <th>客户端IP</th>
                    <th>地理位置</th>
                    <th>方法</th>
                    <th>路径</th>
                    <th>状态码</th>
                    <th>操作类型</th>
                    <th>耗时</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <tr><td colspan="9" class="empty-message">加载中...</td></tr>
            </tbody>
        </table>
        <div id="groupViewContainer" style="display:none;">
            <table class="group-table">
                <thead id="groupThead"></thead>
                <tbody id="groupBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="groupPagination" style="display:none;">
            <div class="pagination-info">
                <span id="groupPageInfo">第1 页 / 第1 页</span>
            </div>
            <div class="pagination-btns">
                <button class="pagination-btn" id="groupPrevBtn" onclick="groupPrevPage()">上一页</button>
                <button class="pagination-btn" id="groupNextBtn" onclick="groupNextPage()">下一页</button>
            </div>
        </div>
        </div>
        <div class="pagination" id="pagination" style="display:none;">
            <span id="pageInfo" style="color:#888;font-size:13px;white-space:nowrap;"></span>
            <div class="pagination-btns" id="pageBtns"></div>
            <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                <option value="20">20 条/页</option>
                <option value="50" selected>50 条/页</option>
                <option value="100">100 条/页</option>
                <option value="200">200 条/页</option>
            </select>
        </div>
    </div>
    
    <script nonce="{{.CSPNonce}}" src="/static/js/log_autorefresh.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/log_detail.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/log_pagination.js"></script>
    <script nonce="{{.CSPNonce}}" src="/static/js/adminlog.js"></script>
</body>
</html>
{{end}}
